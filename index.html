<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --text:#191F28; --sub:#6B7684; --faint:#B0B8C1;
  --line:#E5E8EB; --press:#F2F4F6; --accent:#3182F6; --accent-weak:#E8F3FF;
  --warn:#F08C00; --danger:#F04452; --up:#F04452; --down:#3182F6;
  --shadow:0 8px 24px rgba(0,0,0,.08); --backdrop:rgba(0,0,0,.4);
  --radius:20px; --gutter:20px;
  --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101012; --card:#1C1C1F; --text:#F2F4F6; --sub:#9EA6B0; --faint:#5C636B;
    --line:#2C2C31; --press:#26262A; --accent:#4C94FF; --accent-weak:#1B2A42;
    --warn:#FFA53A; --danger:#FF5C68; --up:#FF5C68; --down:#4C94FF;
    --shadow:0 8px 24px rgba(0,0,0,.5); --backdrop:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;font-size:16px;color:var(--text)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hidden{display:none!important}

/* ---------- 레이아웃 ---------- */
#view{
  position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--safe-top) + 8px) 0 calc(var(--safe-bottom) + 150px);
}
.view-enter{animation:fadeUp .22s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 var(--gutter)}
.topbar h1{font-size:22px;font-weight:700;margin:0}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--sub)}
.icon-btn:active{background:var(--press)}
.icon-btn svg{width:24px;height:24px}
.section{background:var(--card);border-radius:var(--radius);margin:12px 16px;padding:20px}
.section-title{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 12px}
.pressable{transition:transform .12s ease}
.pressable:active{transform:scale(.97)}

/* ---------- 탭바 + 플로팅 버튼 ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);
}
.tab{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--text)}
#fab{
  position:fixed;z-index:21;left:50%;bottom:calc(var(--safe-bottom) + 72px);
  width:60px;height:60px;margin-left:-30px;border-radius:50%;
  background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(49,130,246,.4);
  display:grid;place-items:center;transition:transform .15s ease;
}
#fab:active{transform:scale(.92)}
#fab svg{width:28px;height:28px}

/* ---------- 홈 ---------- */
.hero{padding:8px var(--gutter) 4px}
.cycle-label{font-size:14px;color:var(--sub)}
.hero-amount{font-size:36px;font-weight:700;margin:4px 0 6px;letter-spacing:-.02em}
.hero-amount small{font-size:24px;font-weight:600;margin-left:2px}
.delta{font-size:14px;color:var(--sub)}
.delta b{font-weight:600}
.delta .up{color:var(--up)} .delta .down{color:var(--down)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 16px 0}
.stat{background:var(--card);border-radius:16px;padding:14px 12px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .k2{font-size:11px;color:var(--faint);margin-top:1px}
.stat .v{font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.neg{color:var(--danger)}
.stat .v.muted{font-size:14px;font-weight:600;color:var(--accent)}
.donut-wrap{display:flex;justify-content:center;padding:4px 0 8px}
.donut-center-k{font-size:12px;fill:var(--sub)}
.donut-center-v{font-size:17px;font-weight:700;fill:var(--text)}
.cat-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.cat-ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.cat-main{flex:1;min-width:0}
.cat-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat-name{font-size:16px;font-weight:500}
.cat-amt{font-size:16px;font-weight:600}
.cat-meta{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;margin-top:2px}
/* 도넛과 목록을 색으로 잇는다 (v3.0.1) */
.cat-row{border-radius:14px;padding:10px 8px;transition:background .15s}
.cat-row.on{background:var(--press)}
.cat-bar{height:8px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.cat-bar i{display:block;height:100%;border-radius:4px;transition:width .35s ease}
.cat-pct{font-weight:600}
.donut-seg{cursor:pointer;transition:opacity .2s}
.donut-wrap.picked .donut-seg{opacity:.28}
.donut-wrap.picked .donut-seg.on{opacity:1}
.cat-hint{font-size:12px;color:var(--faint);text-align:center;margin:-2px 0 10px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s ease}
.lv-warn .bar i{background:var(--warn)} .lv-warn .pct{color:var(--warn);font-weight:600}
.lv-over .bar i{background:var(--danger)} .lv-over .pct{color:var(--danger);font-weight:600}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:15px}
.link-btn{color:var(--accent);font-weight:600;font-size:15px;padding:8px 0}

/* ---------- 내역 ---------- */
.search{margin:4px 16px 0;position:relative}
.search input{width:100%;height:44px;border:0;border-radius:12px;background:var(--card);padding:0 14px 0 40px;outline:none}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);color:var(--sub);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.day-head{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);padding:0 4px 4px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:12px}
.tx:active{background:var(--press)}
.tx .cat-ico{width:40px;height:40px}
.tx-main{flex:1;min-width:0}
.tx-title{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:13px;color:var(--sub)}
.tx-amt{font-size:16px;font-weight:600;white-space:nowrap}
.tx.canceled .tx-title,.tx.canceled .tx-amt{text-decoration:line-through;color:var(--faint)}
.tx-amt.refund{color:var(--accent)}
/* 내역 일괄 수정 (v3.2.0) */
body.sel-mode #tabbar, body.sel-mode #fab{display:none}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;min-height:52px}
.selbar .mid{font-size:15px;font-weight:600;text-align:center;flex:1;min-width:0}
.selbar .mid small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ck svg{width:14px;height:14px}
.day-head .ck{width:20px;height:20px}
.day-head{align-items:center;gap:8px}
.day-head .grow{flex:1}
.actbar{
  position:fixed;left:0;right:0;bottom:0;z-index:22;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:10px 16px calc(var(--safe-bottom) + 10px);
  background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);
}
.actbar button{height:48px;border-radius:14px;background:var(--press);font-size:15px;font-weight:600}
.actbar button:active{opacity:.6}
.actbar button.danger{color:var(--danger)}
.actbar button:disabled{opacity:.3}
.cycle-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.cycle-chips::-webkit-scrollbar{display:none}
.cycle-chips .chip{height:30px;font-size:13px}
/* 특별지출 칩 · 목록 요약 (v4.0.2) */
.chip-sp{color:#8A5CF6;background:rgba(138,92,246,.12)}
.chip-sp.on{background:#8A5CF6;color:#fff}
@media (prefers-color-scheme: dark){ .chip-sp{color:#B39BFF;background:rgba(138,92,246,.2)} .chip-sp.on{background:#8A5CF6;color:#fff} }
.list-sum{font-size:13px;color:var(--sub);padding:6px 20px 0}
/* 가져오기 알림 카드 */
.due-card{display:flex;align-items:center;gap:12px;border-radius:var(--radius);margin:4px 16px 12px;padding:16px 20px;animation:fadeUp .25s ease-out}
.due-card.due{background:var(--accent-weak);color:var(--text)}
.due-card.late{background:var(--warn);color:#fff}
.due-card .grow{flex:1}
.due-card b{font-size:16px;font-weight:600;display:block}
.due-card small{font-size:13px;opacity:.85}

/* ---------- 준비 중 화면 ---------- */
.placeholder{text-align:center;color:var(--sub);padding:80px 32px}
.placeholder .big{font-size:48px;margin-bottom:12px}
.placeholder b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

/* ---------- 시트 / 페이지 ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--backdrop);opacity:0;transition:opacity .25s ease}
.backdrop.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);
  border-radius:24px 24px 0 0;padding:8px 16px calc(var(--safe-bottom) + 16px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;
}
.sheet.show{transform:none}
.sheet.full{top:calc(var(--safe-top) + 10px);max-height:none;display:flex;flex-direction:column}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.sheet-head .title{font-size:17px;font-weight:600}
.text-btn{height:44px;padding:0 8px;font-size:16px;font-weight:600;color:var(--accent)}
.text-btn.danger{color:var(--danger)}
.page{
  position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
  padding:calc(var(--safe-top) + 4px) 0 calc(var(--safe-bottom) + 40px);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.page.show{transform:none}
.action-list button{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 8px;border-radius:14px;font-size:17px;font-weight:500;text-align:left}
.action-list button:active{background:var(--press)}
.action-list button:disabled{opacity:.4}
.action-list .emo{font-size:24px;width:32px;text-align:center}
.action-list small{display:block;font-size:13px;color:var(--sub);font-weight:400}
.primary{width:100%;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;transition:transform .12s ease,opacity .2s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.35}
.secondary{width:100%;height:52px;border-radius:14px;background:var(--press);font-size:16px;font-weight:600;margin-top:8px}

/* ---------- 입력 화면 ---------- */
.entry-body{flex:1;display:flex;flex-direction:column;min-height:0}
.date-chip{position:relative;align-self:center;height:34px;padding:0 14px;border-radius:17px;background:var(--press);font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;color:var(--sub)}
.date-chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.amount-display{text-align:center;padding:14px 0 6px;font-size:40px;font-weight:700;letter-spacing:-.02em;min-height:72px}
.amount-display.zero{color:var(--faint)}
.amount-display .won{font-size:28px;margin-left:2px}
.amount-display.bump{animation:bump .12s ease}
@keyframes bump{50%{transform:scale(1.03)}}
.memo{display:block;width:100%;height:44px;border:0;border-radius:12px;background:var(--press);padding:0 14px;outline:none;text-align:center}
.cat-grid{display:grid;grid-auto-flow:row;gap:6px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none;flex:none}
.cat-grid::-webkit-scrollbar{display:none}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;font-size:11px;letter-spacing:-.04em;white-space:nowrap;color:var(--sub);line-height:1.2;text-align:center;transition:background .15s}
.cat-opt .cat-ico{width:40px;height:40px;font-size:20px;transition:transform .15s}
.cat-opt.on{background:var(--accent-weak);color:var(--text);font-weight:600}
.cat-opt.on .cat-ico{transform:scale(1.08);box-shadow:0 0 0 2px var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:auto 0 10px;flex:none}
.key{height:52px;border-radius:14px;font-size:24px;font-weight:500}
.key:active{background:var(--press)}
.key svg{width:26px;height:26px;vertical-align:middle}

@media (max-height:700px){
  .amount-display{padding:6px 0 2px;font-size:34px;min-height:56px}
  .cat-grid{padding:8px 2px 4px}
  .cat-opt .cat-ico{width:34px;height:34px;font-size:18px}
  .key{height:44px;font-size:22px}
  .primary{height:50px}
}

/* ---------- 설정 ---------- */
.list-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0;font-size:16px}
.list-row .val{color:var(--sub);font-size:15px}
button.list-row{width:100%;text-align:left}
button.list-row:active{opacity:.6}
.mini-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}
.mini-btn:active{background:var(--press)}
.mini-btn:disabled{opacity:.25}
.mini-btn svg{width:20px;height:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
.field input{width:100%;height:48px;border:0;border-radius:12px;background:var(--press);padding:0 14px;outline:none}
.hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
.switch-row{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
.switch-row .grow{flex:1}
.switch-row small{display:block;font-size:13px;color:var(--sub)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.danger-btn{width:100%;height:52px;border-radius:14px;color:var(--danger);font-size:16px;font-weight:600;margin-top:8px}
.danger-btn:active{background:var(--press)}

/* ---------- 생활비 게이지 · 예산 카드 ---------- */
.budget-card{background:var(--accent-weak);border-radius:var(--radius);margin:4px 16px 12px;padding:18px 20px;animation:fadeUp .25s ease-out}
.budget-card .t{font-size:15px;font-weight:600}
.budget-card .amt{font-size:26px;font-weight:700;margin:4px 0 2px}
.budget-card .why{font-size:13px;color:var(--sub)}
.budget-card .btns{display:flex;gap:8px;margin-top:14px}
.budget-card .btns button{flex:1;height:44px;border-radius:12px;font-size:15px;font-weight:600;transition:transform .12s}
.budget-card .btns button:active{transform:scale(.97)}
.btn-ghost{background:var(--card);color:var(--text)}
.btn-fill{background:var(--accent);color:#fff}
.gauge-head{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--sub);min-height:32px}
/* 주기 넘기기 (v3.1.0) */
.cyc-nav{display:flex;align-items:center;gap:2px;margin-left:-8px}
.cyc-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}
.cyc-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--sub)}
.cyc-btn svg{width:18px;height:18px}
.cyc-btn:active{background:var(--press)}
.cyc-btn:disabled{opacity:.2}
.gauge-head .tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-weak);padding:2px 8px;border-radius:8px}
.gauge-amt{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.gauge-amt small{font-size:22px;font-weight:600;margin-left:2px}
.gauge-of{font-size:14px;color:var(--sub)}
.pace-chart{margin:14px 0 10px;touch-action:pan-y}
.pace-chart svg{display:block;width:100%;height:auto;overflow:visible}
.readout{font-size:13px;color:var(--sub);min-height:20px}
.readout b{color:var(--text);font-weight:600}
.pc-axis{font-size:11px;fill:var(--sub)}
.pc-budget{font-size:11px;fill:var(--sub);font-weight:600}
.pc-pace{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.pc-base{stroke:var(--line);stroke-width:1}
.pc-line{stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.pc-area{stroke:none;opacity:.12}
.pc-dot{stroke:var(--card);stroke-width:2.5}
.pc-scrub{stroke:var(--sub);stroke-width:1;opacity:0}
.pc-scrub.on{opacity:.6}
.pace{font-size:15px;line-height:1.55}
.pace b{font-weight:700}
.pace .sub{color:var(--sub)}
.st-calm{--st:var(--accent)} .st-warn{--st:var(--warn)} .st-over{--st:var(--danger)}
.st-calm .pace b,.st-warn .pace b,.st-over .pace b{color:var(--st)}
.pc-line{stroke:var(--st,var(--accent))} .pc-area,.pc-dot{fill:var(--st,var(--accent))}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:2px}
.legend i{display:inline-block;width:16px;height:0;vertical-align:middle;margin-right:5px;border-top:2.5px solid var(--st,var(--accent))}
.legend i.dash{border-top:1.5px dashed var(--faint)}
.delta-line{font-size:13px;color:var(--sub);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.stats.two{grid-template-columns:1fr 1fr;margin-top:0}
.label{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}

  <button class="tab" data-tab="salary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V13M12 20V8M19 20V4"/></svg>급여</button>

<div id="toast"></div>

<script>
'use strict';
const APP_VERSION = '4.0.2';

/* =====================================================================
   계산 로직 (화면과 분리 — 테스트 대상)
   ===================================================================== */
/*LOGIC-START*/
const PAYDAY = 25;
const DEFAULT_THRESHOLD = 300000;
const pad = n => String(n).padStart(2, '0');
function toYMD(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYMD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYMD(s); d.setDate(d.getDate() + n); return toYMD(d); }
function diffDays(a, b) { return Math.round((parseYMD(b) - parseYMD(a)) / 86400000); } // b - a

/** 특별지출 반기: 급여 주기 기준. 상반기 = 1~6월 주기(1.25~7.24), 하반기 = 7~12월 주기(7.25~다음 해 1.24) */
function halfOf(ymd) {
  const c = cycleOf(ymd);
  const [y, m] = c.id.split('-').map(Number);
  const first = m <= 6;
  return {
    id: `${y}-H${first ? 1 : 2}`,
    start: first ? `${y}-01-25` : `${y}-07-25`,
    end: first ? `${y}-07-24` : `${y + 1}-01-24`,
    label: `${String(y).slice(2)}년 ${first ? '상' : '하'}반기`,
  };
}
/** 날짜가 속한 급여 주기 (25일 ~ 다음 달 24일).
 *  id는 시작 월 기준('2026-08' = 8/25~9/24). 저장된 데이터의 키라서 절대 바꾸지 않는다.
 *  화면에 쓰는 name/label은 끝나는 달 기준 (v4.0.2) — 8/25~9/24는 31일 중 24일이 9월이라 '9월'.
 *  시작 월로 부르면 내역에서 '8월'을 눌렀을 때 9월 내역이 나와 한 달 밀려 보였다. */
function cycleOf(ymd) {
  let [y, m, d] = ymd.split('-').map(Number);
  if (d < PAYDAY) { m -= 1; if (m === 0) { m = 12; y -= 1; } }
  let ey = y, em = m + 1;
  if (em === 13) { em = 1; ey += 1; }
  return {
    id: `${y}-${pad(m)}`,
    start: `${y}-${pad(m)}-${pad(PAYDAY)}`,
    end: `${ey}-${pad(em)}-${pad(PAYDAY - 1)}`,
    label: `${em}월 주기`,
    name: `${em}월`,
  };
}
function prevCycle(c) { return cycleOf(addDays(c.start, -1)); }
function cycleDays(c) { return diffDays(c.start, c.end) + 1; }
function inRange(ymd, a, b) { return ymd >= a && ymd <= b; }
/** 취소 건은 모든 합계에서 제외 */
function isCounted(t) { return t.status !== 'canceled'; }
function isLiving(t) { return isCounted(t) && t.kind !== 'special'; }
function isSpecial(t) { return isCounted(t) && t.kind === 'special'; }
function sumAmount(list) { return list.reduce((s, t) => s + t.amount, 0); }
function changeRate(cur, prev) { return prev > 0 ? Math.round((cur - prev) / prev * 100) : null; }
function formatWon(n) { return Math.round(n).toLocaleString('ko-KR'); }
/** 1,510,000 → "151만", 445,000 → "44.5만" */
function formatMan(n) {
  if (Math.abs(n) < 10000) return `${formatWon(n)}원`;
  return `${(Math.round(n / 1000) / 10).toLocaleString('ko-KR')}만`;
}
function roundTo(n, unit) { return Math.round(n / unit) * unit; }
function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* ---- 생활비 / 특별지출 분류 ----
   판정 순서: 1) 이벤트에 묶임 → 특별  2) 특별지출 카테고리 → 특별
             3) 기준 금액 이상 → 저장 때 한 번 질문  4) 나머지 → 생활비
   kindSource: auto(규칙) / asked(질문에 답함) / manual(수정 화면에서 직접 바꿈 — 항상 유지) */
function classifyAuto(t, catMap) {
  if (t.eventId) return 'special';
  const c = catMap[t.categoryId];
  if (c && c.isSpecial) return 'special';
  return 'living';
}
/** 저장·재계산 시 분류 결정. ask=true면 화면에서 질문해야 함 */
function resolveKind(t, catMap, threshold) {
  if (t.kindSource === 'manual') return { kind: t.kind, kindSource: 'manual', ask: false };
  if (classifyAuto(t, catMap) === 'special') return { kind: 'special', kindSource: 'auto', ask: false };
  if (t.amount >= threshold) {
    if (t.kindSource === 'asked') return { kind: t.kind, kindSource: 'asked', ask: false };
    // 고정지출 자동 기록 건과 가져오기 건은 묻지 않는다 (가져오기는 확인 대기함에서 이미 물었다)
    return { kind: 'living', kindSource: 'auto', ask: t.method !== 'fixed-auto' && t.method !== 'import' };
  }
  return { kind: 'living', kindSource: 'auto', ask: false };
}
/** 질문 없이 다시 계산(카테고리 스위치 변경, 카테고리 삭제, 마이그레이션) */
function recomputeKind(t, catMap, threshold) {
  const r = resolveKind(t, catMap, threshold);
  return { ...t, kind: r.kind, kindSource: r.kindSource };
}

/** 카테고리 삭제: 해당 내역을 대상 카테고리로 옮기고 분류를 다시 계산. 바뀐 내역만 반환 */
function reassignCategory(txs, fromId, toId, catMap, threshold) {
  return txs.filter(t => t.categoryId === fromId)
    .map(t => recomputeKind({ ...t, categoryId: toId }, catMap, threshold));
}

/** 예산 짜기에서 정한 생활비를 반기 끝까지 이어 쓴다 (v4.0.2).
 *  plan = meta.livingPlan {halfId, amount}. 오늘이 그 반기 안일 때만 돌려준다. 반기가 바뀌면 null → 실적 중앙값 제안으로 돌아간다 */
function planLivingFor(plan, today) {
  if (!plan || !(plan.amount > 0)) return null;
  return plan.halfId === halfOf(today).id ? plan.amount : null;
}

/** 실적을 어디까지 거슬러 셀지 정하는 기준선 (v4.0.1).
 *  설치일만 쓰면 파일로 가져온 설치 이전 주기가 전부 빠진다. 설치일과 가장 이른 내역 날짜 중 이른 쪽을 쓴다.
 *  주기 시작일이 이 날짜보다 앞서면 후보에서 빠지므로, 파일 첫 주기처럼 반쪽만 있는 주기는 그대로 걸러진다. */
function coverageStart(installedYMD, earliestTxYMD, today) {
  return [installedYMD, earliestTxYMD].filter(Boolean).sort()[0] || today;
}

/* ---- 생활비 예산 제안 ----
   기준선(coverageStart) 뒤에 시작해 이미 끝난 주기 중 최근 3개의 생활비 중앙값 → 10만원 단위 반올림 */
function suggestBudget(txs, today, installYMD) {
  const sums = [];
  let c = prevCycle(cycleOf(today));
  while (sums.length < 3 && c.start >= installYMD) {
    const cc = c;
    sums.push(sumAmount(txs.filter(t => isLiving(t) && inRange(t.date, cc.start, cc.end))));
    c = prevCycle(c);
  }
  if (!sums.length) return null;
  const med = median(sums);
  const amount = roundTo(med, 100000);
  if (amount <= 0) return null;
  return { amount, median: med, count: sums.length };
}
function minus5(v) { return Math.max(10000, roundTo(v * 0.95, 10000)); }

/* ---- 페이스 ----
   차이(%p) = 지출률 − 날짜 진행률
   여유 ≤ −5 < 계획대로 ≤ +3 < 약간 빠름 ≤ +15 < 빠름, 지출률 100% 이상 = 초과 */
function paceOf(spent, budget, today, c) {
  const total = cycleDays(c);
  const elapsed = diffDays(c.start, today) + 1;
  const daysLeft = total - elapsed + 1;
  const dayRate = elapsed / total;
  const spendRate = spent / budget;
  const diff = (spendRate - dayRate) * 100;
  let status, level;
  if (spendRate >= 1) { status = '초과'; level = 'over'; }
  else if (diff > 15) { status = '빠름'; level = 'warn'; }
  else if (diff > 3) { status = '약간 빠름'; level = 'warn'; }
  else if (diff > -5) { status = '계획대로'; level = 'calm'; }
  else { status = '여유'; level = 'calm'; }
  const ideal = roundTo(budget * dayRate, 1000); // 오늘까지 쓰기로 한 금액 (천원 단위)
  return {
    dayPct: Math.round(dayRate * 100), spendPct: Math.round(spendRate * 100),
    status, level, daysLeft, total, elapsed, ideal, gap: spent - ideal,
    daily: Math.floor(Math.max(0, budget - spent) / daysLeft),
  };
}

/** 주기 시작일부터 오늘까지 날짜별 누적 생활비 [1일차, 2일차, ...] */
function cumulativeSeries(txs, c, today) {
  const n = diffDays(c.start, today) + 1;
  const daily = new Array(n).fill(0);
  txs.forEach(t => {
    if (!isLiving(t) || !inRange(t.date, c.start, today)) return;
    daily[diffDays(c.start, t.date)] += t.amount;
  });
  let acc = 0;
  return daily.map(v => (acc += v));
}

/** 홈 화면 숫자 전부 계산.
 *  ref     = 기준일. 이 날짜가 속한 주기를 보여준다. 지난 주기를 볼 때는 그 주기의 마지막 날을 넣는다 (v3.1.0)
 *  budget  = 그 주기의 생활비 예산 (없으면 null)
 *  todayY  = 오늘 (안 넣으면 ref와 같다). '오늘 쓴 돈'에만 쓴다 */
function homeStats(txs, categories, ref, budget, todayY) {
  const today = todayY || ref;
  const c = cycleOf(ref), p = prevCycle(c);
  const cur = txs.filter(t => isCounted(t) && inRange(t.date, c.start, c.end));
  const living = cur.filter(isLiving);
  const elapsed = diffDays(c.start, ref) + 1;
  const pSameEnd = [addDays(p.start, elapsed - 1), p.end].sort()[0];
  const prevSame = sumAmount(txs.filter(t => isLiving(t) && inRange(t.date, p.start, pSameEnd)));
  const livingTotal = sumAmount(living);
  const total = livingTotal;

  const byCat = {};
  living.forEach(t => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + t.amount; });
  // 환급(음수)이 섞이면 카테고리 합계가 0 이하가 될 수 있다. 도넛에는 양수만 올린다 (v3.0.0)
  const catRows = categories
    .map(k => ({ cat: k, spent: byCat[k.id] || 0, share: total > 0 ? (byCat[k.id] || 0) / total : 0 }))
    .filter(r => r.spent > 0)
    .sort((a, b) => b.spent - a.spent || a.cat.order - b.cat.order);
  const negRows = categories
    .map(k => ({ cat: k, spent: byCat[k.id] || 0 }))
    .filter(r => r.spent < 0)
    .sort((a, b) => a.spent - b.spent);

  return {
    cycle: c, catRows, negRows, elapsed,
    living: livingTotal,
    half: halfOf(ref),
    special: sumAmount(txs.filter(t => isSpecial(t) && inRange(t.date, halfOf(ref).start, halfOf(ref).end))),
    series: cumulativeSeries(txs, c, ref),
    today: sumAmount(cur.filter(t => t.date === today)),
    avgDaily: elapsed > 0 ? Math.floor(livingTotal / elapsed) : 0,
    budgetPct: budget ? Math.round(livingTotal / budget * 100) : null,
    prevSame, change: changeRate(livingTotal, prevSame),
    daysLeft: cycleDays(c) - elapsed + 1,
    pace: budget ? paceOf(livingTotal, budget, ref, c) : null,
  };
}

/* ---- 가져오기 알림 (v3.2.0) ----
   기준은 '마지막으로 파일을 가져온 날'이다.
   '내역의 마지막 날짜'로 재면 며칠 돈을 안 썼을 때 비어 있다고 잘못 알린다. */
function lastImportYMD(batches) {
  if (!batches || !batches.length) return null;
  const last = batches.reduce((a, b) => (b.importedAt > a.importedAt ? b : a));
  return toYMD(new Date(last.importedAt));
}
/** everyDays가 지났으면 {days, ymd, level}. 아니면 null. 한 번도 안 가져왔으면 알리지 않는다 */
function importDue(batches, today, everyDays) {
  if (!everyDays) return null;
  const ymd = lastImportYMD(batches);
  if (!ymd) return null;
  const days = diffDays(ymd, today);
  if (days < everyDays) return null;
  return { days, ymd, level: days >= everyDays * 2 ? 'late' : 'due' };
}

/* ---- 내역 일괄 수정 (v3.2.0) ---- */
/** 고른 내역의 카테고리를 한꺼번에 바꾼다. 분류는 질문 없이 다시 계산한다 */
function bulkSetCategory(txs, ids, catId, catMap, threshold, now) {
  const set = new Set(ids);
  return txs.filter(t => set.has(t.id))
    .map(t => ({ ...recomputeKind({ ...t, categoryId: catId }, catMap, threshold), updatedAt: now }));
}
/** 고른 내역을 생활비/특별지출로 바꾼다. 직접 바꾼 것이므로 항상 유지된다 */
function bulkSetKind(txs, ids, kind, now) {
  const set = new Set(ids);
  return txs.filter(t => set.has(t.id)).map(t => ({ ...t, kind, kindSource: 'manual', updatedAt: now }));
}
/** 내역이 들어 있는 주기 목록 (최근 것부터). 내역 탭 주기 칩에 쓴다 */
function cyclesInData(txs, today, max = 12) {
  const ids = new Set(txs.map(t => cycleOf(t.date).id));
  ids.add(cycleOf(today).id);
  return [...ids].sort().reverse().slice(0, max)
    .map(id => { const [y, m] = id.split('-').map(Number); return cycleOf(`${y}-${pad(m)}-${pad(PAYDAY)}`); });
}

/** 내역 탭 필터 (v4.0.2). 조건은 모두 AND로 건다.
 *  opts: { cycleId:'all'|id, catId:'all'|id, special:bool, q:string }
 *  special=true면 특별지출만. 취소 건도 목록에는 남긴다 (합계에서만 빠진다) */
function filterTxList(txs, opts) {
  const o = opts || {};
  const q = (o.q || '').trim().toLowerCase();
  return txs
    .filter(t => !o.cycleId || o.cycleId === 'all' || cycleOf(t.date).id === o.cycleId)
    .filter(t => !o.catId || o.catId === 'all' || t.categoryId === o.catId)
    .filter(t => !o.special || t.kind === 'special')
    .filter(t => !q || (t.merchant || '').toLowerCase().includes(q))
    .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time) || (b.createdAt || 0) - (a.createdAt || 0));
}
/** 목록 요약: 합계에 들어가는 건수와 금액 (취소 건 제외) */
function listSummary(list) {
  const counted = list.filter(isCounted);
  return { count: counted.length, total: sumAmount(counted) };
}

/** 내역이 있는 가장 이른 주기 (◀ 를 어디까지 누를 수 있는지) */
function earliestCycle(txs, today) {
  const d = txs.map(t => t.date).sort()[0];
  return cycleOf(d || today);
}
/** 주기를 앞뒤로 옮긴다. 이번 주기로 돌아오면 null을 돌려준다 (= 오늘 기준) */
function shiftCycleRef(ref, dir, today) {
  const c = cycleOf(ref);
  const n = dir < 0 ? prevCycle(c) : nextCycle(c);
  if (inRange(today, n.start, n.end)) return null;
  return dir < 0 ? n.end : n.end;
}

/** 키패드 입력 처리: 현재 문자열 + 키 → 새 문자열 */
function keypadInput(cur, key) {
  if (key === 'back') return cur.slice(0, -1);
  if (key === 'clear') return '';
  let next = cur + key;
  next = next.replace(/^0+/, '');
  if (next.length > 10) return cur;
  return next;
}

/* ---- 고정지출 (v2.0.0) ----
   - 출금일이 그 달에 없으면 말일 (31 = 항상 말일)
   - 주기마다 정확히 한 번 출금: 출금일 ≥ 25면 주기 시작 달, < 25면 다음 달
   - 출금일 당일에 완료
   v3.0.0: 지출 자동 기록은 하지 않는다. 실제 기록은 파일 가져오기가 담당한다.
           dueFixed/makeFixedTx는 이미 기록된 데이터의 호환과 테스트를 위해 남겨 둔다. */
function nextCycle(c) { return cycleOf(addDays(c.end, 1)); }

function payDateOn(y, m, payDay) { return `${y}-${pad(m)}-${pad(Math.min(payDay, lastDayOf(y, m)))}`; }
function fixedDateInCycle(payDay, c) {
  const [y, m] = c.start.split('-').map(Number);
  if (payDay >= PAYDAY) return payDateOn(y, m, payDay);
  const [ey, em] = c.end.split('-').map(Number);
  return payDateOn(ey, em, payDay);
}
function payDayLabel(payDay) { return payDay >= 31 ? '말일' : `${payDay}일`; }
/** 오늘 이후(오늘 제외) 첫 출금일 */
function nextFixedDate(payDay, today) {
  const c = cycleOf(today);
  const d = fixedDateInCycle(payDay, c);
  return d > today ? d : fixedDateInCycle(payDay, nextCycle(c));
}
const fixedKey = (fixedId, date) => `${fixedId}_${date}`;
const isActiveFixed = f => f.active !== false;
function byDateName(a, b) { return a.date.localeCompare(b.date) || a.f.name.localeCompare(b.f.name); }

/** 고정지출 탭: 이번 주기 항목(출금일 순)과 남은 합계. 카드 항목도 합계에 포함 */
function fixedCycleView(fixeds, today) {
  const cycle = cycleOf(today);
  const items = fixeds.filter(isActiveFixed).map(f => {
    const date = fixedDateInCycle(f.payDay, cycle);
    return { f, date, done: date <= today, dday: diffDays(today, date) };
  }).sort(byDateName);
  const rest = items.filter(x => !x.done);
  return { cycle, items, total: sumAmount(items.map(x => x.f)), remaining: sumAmount(rest.map(x => x.f)), remainingCount: rest.length };
}
/** 홈: 다가오는 출금 n개 (주기를 넘어가도 됨) */
function upcomingFixed(fixeds, today, n = 3) {
  return fixeds.filter(isActiveFixed)
    .map(f => { const date = nextFixedDate(f.payDay, today); return { f, date, dday: diffDays(today, date) }; })
    .sort(byDateName).slice(0, n);
}
/** (v2.0.0 호환용) 지출로 기록해야 할 계좌 출금 목록 */
function dueFixed(fixeds, doneKeys, today) {
  const out = [];
  fixeds.forEach(f => {
    if (!isActiveFixed(f) || f.method !== 'account' || !f.recordFrom || f.recordFrom > today) return;
    for (let c = cycleOf(f.recordFrom); c.start <= today; c = nextCycle(c)) {
      const date = fixedDateInCycle(f.payDay, c);
      const key = fixedKey(f.id, date);
      if (date >= f.recordFrom && date <= today && !doneKeys.has(key)) out.push({ f, date, key });
    }
  });
  return out.sort(byDateName);
}
/** (v2.0.0 호환용) 계좌 출금 → 지출 내역 */
function makeFixedTx(f, date, catMap, threshold, fallbackId, id, now) {
  const categoryId = catMap[f.categoryId] ? f.categoryId : fallbackId;
  return recomputeKind({
    id, amount: f.amount, categoryId, merchant: f.name, date, time: '00:00',
    method: 'fixed-auto', fixedId: f.id, status: 'active', eventId: null,
    kind: 'living', kindSource: 'auto', createdAt: now, updatedAt: now,
  }, catMap, threshold);
}
/** 새로 등록할 때 이번 주기 출금일이 이미 지났으면 그 날짜, 아니면 null */
function passedThisCycle(payDay, today) {
  const d = fixedDateInCycle(payDay, cycleOf(today));
  return d <= today ? d : null;
}
function recordFromOnCreate(payDay, today, recordPast) {
  const passed = passedThisCycle(payDay, today);
  return recordPast && passed ? passed : addDays(today, 1);
}
function recordFromOnEdit(old, next, today) {
  if (old.payDay === next.payDay && old.method === next.method) return old.recordFrom;
  const tomorrow = addDays(today, 1);
  return old.recordFrom && old.recordFrom > tomorrow ? old.recordFrom : tomorrow;
}
function reassignFixed(fixeds, fromId, toId) {
  return fixeds.filter(f => f.categoryId === fromId).map(f => ({ ...f, categoryId: toId }));
}
function reassignRules(rules, fromId, toId) {
  return Object.values(rules).filter(r => r.categoryId === fromId).map(r => ({ ...r, categoryId: toId }));
}

/* =====================================================================
   뱅크샐러드 파일 가져오기 (v3.0.0) — LOGIC 블록에 들어갈 코드
   외부 라이브러리 없이 xlsx를 직접 읽는다.
   ===================================================================== */

/* ---- ZIP (xlsx 컨테이너) ---- */
const u16 = (v, o) => v[o] | (v[o + 1] << 8);
const u32 = (v, o) => (v[o] | (v[o + 1] << 8) | (v[o + 2] << 16) | (v[o + 3] << 24)) >>> 0;

/** xlsx(ZIP)에서 엔트리 목록을 읽고, 필요한 것만 그때그때 푼다 */
function openZip(buf) {
  const v = new Uint8Array(buf);
  let eocd = -1;
  for (let i = v.length - 22; i >= 0 && i > v.length - 66000; i--) {
    if (u32(v, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('엑셀 파일이 아니에요');
  const count = u16(v, eocd + 10);
  const entries = {};
  let p = u32(v, eocd + 16);
  for (let i = 0; i < count; i++) {
    if (u32(v, p) !== 0x02014b50) break;
    const method = u16(v, p + 10);
    const csize = u32(v, p + 20);
    const nameLen = u16(v, p + 28), extraLen = u16(v, p + 30), cmtLen = u16(v, p + 32);
    const lho = u32(v, p + 42);
    entries[new TextDecoder().decode(v.subarray(p + 46, p + 46 + nameLen))] = { method, csize, lho };
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return {
    names: Object.keys(entries),
    has: n => !!entries[n],
    async text(n) {
      const e = entries[n];
      if (!e) return null;
      const start = e.lho + 30 + u16(v, e.lho + 26) + u16(v, e.lho + 28);
      const data = v.subarray(start, start + e.csize);
      if (e.method === 0) return new TextDecoder().decode(data);
      if (e.method !== 8) throw new Error('지원하지 않는 압축 방식이에요');
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('이 기기에서는 엑셀 파일을 열 수 없어요. iOS 16.4 이상으로 업데이트해 주세요');
      }
      const s = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return await new Response(s).text();
    },
  };
}

/* ---- xlsx XML ---- */
const xmlUnesc = s => s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-fA-F]+);/g, (m, g) => {
  if (g === 'lt') return '<'; if (g === 'gt') return '>'; if (g === 'amp') return '&';
  if (g === 'quot') return '"'; if (g === 'apos') return "'";
  return String.fromCodePoint(g[1] === 'x' ? parseInt(g.slice(2), 16) : Number(g.slice(1)));
});
const attrOf = (tag, name) => {
  const m = tag.match(new RegExp(`${name}="([^"]*)"`));
  return m ? m[1] : null;
};
/** <si> 안의 모든 <t>를 이어 붙인다 (서식이 섞인 문자열 대응) */
function parseSharedStrings(xml) {
  if (!xml) return [];
  return (xml.match(/<si>[\s\S]*?<\/si>|<si\/>/g) || []).map(si => {
    const ts = si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
    return xmlUnesc(ts.map(t => t.replace(/<t[^>]*>|<\/t>/g, '')).join(''));
  });
}
const colIndex = ref => {
  let n = 0;
  for (const ch of ref) {
    const c = ch.charCodeAt(0);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
};
/** 시트 XML → 행 배열. 각 행은 셀 값 배열(빈 칸은 null) */
function parseSheet(xml, shared) {
  const rows = [];
  for (const rowXml of xml.match(/<row[^>]*\/>|<row[\s\S]*?<\/row>/g) || []) {
    const cells = [];
    for (const cellXml of rowXml.match(/<c[^>]*\/>|<c[^>]*>[\s\S]*?<\/c>/g) || []) {
      const head = cellXml.slice(0, cellXml.indexOf('>') + 1);
      const i = colIndex(attrOf(head, 'r') || '');
      const t = attrOf(head, 't');
      let val = null;
      if (t === 'inlineStr') {
        const ts = cellXml.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
        val = xmlUnesc(ts.map(x => x.replace(/<t[^>]*>|<\/t>/g, '')).join(''));
      } else {
        const m = cellXml.match(/<v>([\s\S]*?)<\/v>/);
        if (m) {
          const raw = xmlUnesc(m[1]);
          if (t === 's') val = shared[Number(raw)] ?? null;
          else if (t === 'str' || t === 'e') val = raw;
          else if (t === 'b') val = raw === '1';
          else val = Number(raw);
        }
      }
      if (i >= 0) cells[i] = val === undefined ? null : val;
    }
    rows.push(cells);
  }

}
/** 엑셀 날짜 일련번호 → 'YYYY-MM-DD' (1899-12-30 기준) */
function excelDate(n) {
  const d = new Date(Math.round(Number(n)) * 86400000 + Date.UTC(1899, 11, 30));
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}
/** 엑셀 시각(하루의 소수) → 'HH:MM' */
function excelTime(n) {

  if (!isFinite(s) || s < 0) s = 0;
  return `${pad(Math.floor(s / 3600) % 24)}:${pad(Math.floor(s / 60) % 60)}`;
}
/** 문자열로 들어온 날짜·시각도 받아 준다 */
function cellDate(v) {
  if (v == null) return null;
  if (typeof v === 'number') return excelDate(v);
  const m = String(v).match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : null;
}
function cellTime(v) {
  if (v == null) return '00:00';
  if (typeof v === 'number') return excelTime(v);
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  return m ? `${pad(+m[1])}:${m[2]}` : '00:00';
}
/** 중복 방지 키에만 쓰는 초 단위 시각 'HH:MM:SS' (같은 분에 같은 금액이 두 번 찍히는 경우 구분) */
function cellSec(v) {
  if (v == null) return '00:00:00';
  if (typeof v === 'number') {
    let s = Math.round((Number(v) % 1) * 86400);
    if (!isFinite(s) || s < 0) s = 0;
    return `${pad(Math.floor(s / 3600) % 24)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const m = String(v).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? `${pad(+m[1])}:${m[2]}:${m[3] || '00'}` : '00:00:00';
}
function cellNum(v) {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return Math.round(v);
  const n = Number(String(v).replace(/[^\d.-]/g, ''));
  return isFinite(n) ? Math.round(n) : 0;
}

/* ---- 뱅크샐러드 파일 읽기 ---- */
const BS_SHEET = '가계부 내역';
const BS_COLS = ['날짜', '시간', '타입', '대분류', '소분류', '내용', '금액', '화폐', '결제수단', '메모'];

/** xlsx ArrayBuffer → 표준 행 배열. '가계부 내역' 시트만 읽는다 ('뱅샐현황'은 개인정보라 건드리지 않음) */
async function readBanksalad(buf) {
  const zip = openZip(buf);
  const wb = await zip.text('xl/workbook.xml');
  if (!wb) throw new Error('엑셀 파일 구조를 읽을 수 없어요');
  const sheets = (wb.match(/<sheet[^>]*\/>/g) || []).map(t => ({
    name: attrOf(t, 'name'), rid: attrOf(t, 'r:id') || attrOf(t, 'id'),
  }));
  const target = sheets.find(s => s.name === BS_SHEET) || sheets.find(s => (s.name || '').includes('내역'));
  if (!target) throw new Error(`'${BS_SHEET}' 시트를 찾을 수 없어요. 뱅크샐러드에서 받은 파일이 맞는지 확인해 주세요`);
  const rels = (await zip.text('xl/_rels/workbook.xml.rels')) || '';
  let path = null;
  for (const t of rels.match(/<Relationship[^>]*\/>/g) || []) {
    if (attrOf(t, 'Id') === target.rid) { path = attrOf(t, 'Target'); break; }
  }
  path = path ? (path.startsWith('/') ? path.slice(1) : `xl/${path.replace(/^\.\//, '')}`) : null;
  if (!path || !zip.has(path)) {
    const i = sheets.indexOf(target) + 1;
    path = `xl/worksheets/sheet${i}.xml`;
  }
  const shared = parseSharedStrings(await zip.text('xl/sharedStrings.xml'));
  const grid = parseSheet(await zip.text(path), shared);
  return parseBanksaladRows(grid);
}

/** 헤더 줄을 찾아 컬럼 위치를 잡고 행을 표준 형태로 바꾼다 */
function parseBanksaladRows(grid) {
  let head = -1;
  for (let i = 0; i < Math.min(grid.length, 20); i++) {
    const cells = (grid[i] || []).map(c => String(c ?? '').trim());
    if (cells.includes('날짜') && cells.includes('금액') && cells.includes('타입')) { head = i; break; }
  }
  if (head < 0) throw new Error('표의 첫 줄(날짜·타입·금액)을 찾을 수 없어요');
  const pos = {};
  (grid[head] || []).forEach((c, i) => { const k = String(c ?? '').trim(); if (BS_COLS.includes(k)) pos[k] = i; });
  const out = [];
  for (let i = head + 1; i < grid.length; i++) {
    const r = grid[i] || [];
    const at = k => (pos[k] === undefined ? null : r[pos[k]] ?? null);
    const date = cellDate(at('날짜'));
    if (!date) continue;
    out.push({
      date, time: cellTime(at('시간')), sec: cellSec(at('시간')),
      type: String(at('타입') ?? '').trim(),
      cat1: String(at('대분류') ?? '').trim(),
      cat2: String(at('소분류') ?? '').trim(),
      content: String(at('내용') ?? '').trim(),
      amount: cellNum(at('금액')),
      currency: String(at('화폐') ?? '').trim(),
      method: String(at('결제수단') ?? '').trim(),
      memo: String(at('메모') ?? '').trim(),
    });
  }
  return out;
}

/* ---- 중복 방지 ---- */
/** 날짜+시각(초까지)+금액+내용+결제수단. 실파일 1,262행에서 충돌 0건 확인
 *  분 단위로 자르면 같은 분에 같은 금액이 두 번 찍힌 4건이 겹친다 */
function rowKey(r) { return [r.date, r.sec || r.time, r.amount, r.content, r.method].join('|'); }
/** 회차·전표 번호가 붙어 매번 달라지는 이름을 규칙 키로 묶는다
 *  '867707**70   ,2512-38회차' → '######**##, ####-##회차' */
function normalizeName(s) {
  return String(s || '').replace(/\d/g, '#').replace(/\s+/g, ' ').trim();
}
const ruleKey = (type, name) => `${type}|${name}`;
/** 외부 라이브러리 없는 32비트 문자열 해시 (FNV-1a) */
function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
function rowId(r) { return `${r.date}_${hashStr(rowKey(r))}`; }

/* ---- 행 분류 ----
   기록하는 행의 앱 금액 = −(파일 금액). 부호가 방향을 나타낸다.
     지출 −4,900 → 지출 4,900   |  지출 +5,900(취소) → 환급 −5,900
     이체 −20,000(타인 송금) → 지출 20,000  |  이체 +22,666(정산 입금) → 환급 −22,666 */
/** 타입 '이체' 중 생활비에서 빼는 대분류.
 *  내계좌이체·카드대금·저축·투자 = 내 돈이 옮겨간 것
 *  현금 = 환전·ATM (여행 환전 등)
 *  대출 = 빌린 돈
 *  미분류 = '입금 내역' 같은 출처 불명 = 급여 외 소득
 *  남는 것은 대분류 '이체' 하나뿐이고, 그것이 타인과 주고받은 돈(N빵)이다 */
const BS_SELF_TRANSFER = ['내계좌이체', '카드대금', '저축', '투자', '현금', '대출', '미분류'];
/** 타입 '수입'은 전부 뺀다. 급여도, 이자·캐시백·잡수입도 생활비 계산을 흐린다.
 *  N빵으로 받은 돈은 타입 '이체'로 들어오므로 여기서 빠져도 문제없다 */
const BS_INCOME_SKIP = null;
/** 이체·수입의 소액은 무시한다 (1원 입금, 2원 적립 같은 잡다한 것). 지출은 금액과 상관없이 기록한다 */
const BS_MIN_TRANSFER = 1000;
/** 타인 이체가 이 금액 이상이면 확인 대기함으로 보낸다.
 *  N빵은 보통 수만 원대다. 전세금·가족 송금 같은 큰돈이 생활비에 섞이면 그 주기가 통째로 망가진다.
 *  (실파일에 4,900만원 입금 1건, 100만원 이상 6건이 있었다) */
const BS_BIG_TRANSFER = 300000;
/** 처음부터 들어 있는 규칙. 사람이 아니라 회사·기관에서 받은 돈은 생활비가 아니다 */
const BS_DEFAULT_RULES = {
  '이체|엘지에너지솔루션': { kind: 'exclude' },
  '이체|싱글캐시백': { kind: 'exclude' },
};
/** 대분류 '금융'(지출)의 소분류 — 실제 소비가 아닌 것과, 사람이 봐야 하는 것 */
/** 대분류 '금융'(지출) 중 실제 소비가 아닌 것. 나머지(송금 내역·이자/대출·세금·보험·카드)는 기록한다.
 *  '송금 내역' 39건은 전부 카카오페이 머니 송금(N빵)이라 지출이 맞다 */
const BS_FINANCE_SKIP = ['증권/투자'];
/** 현금 인출만 사람이 본다. 인출한 현금을 어디에 썼는지는 파일에 없다 */
const BS_BANK_ASK = ['ATM'];
/** 간편결제 충전. 실제 지출은 결제 행에 따로 있어서 여기서 잡으면 이중 계상된다 */
const BS_DEFAULT_CHARGE = ['카카오페이', '네이버페이충전', '충전 내역', '토스페이', '토스머니', '네이버페이'];
/** 뱅크샐러드 대분류 → 앱 카테고리 이름 (초기값. 사용자가 고치면 학습 규칙이 이긴다) */
const BS_CATEGORY_MAP = {
  '식비': '식비', '카페/간식': '카페·간식', '술/유흥': '술·모임', '교통': '교통', '자동차': '교통',
  '온라인쇼핑': '쇼핑', '패션/쇼핑': '쇼핑', '뷰티/미용': '미용', '주거/통신': '주거·통신',
  '의료/건강': '건강', '문화/여가': '문화·여가', '경조/선물': '경조사·선물',
  '생활': '기타', '여행/숙박': '기타', '교육/학습': '기타', '금융': '기타', '자녀/육아': '기타', '미분류': '기타',
};

/** 한 행의 처리 방법을 정한다.
 *  settings: { excludeMethods:[], chargeNames:[], rules:{ 이름: {kind:'record'|'exclude', categoryName} } }
 *  → { decision:'record'|'exclude'|'pending', reason, amount, categoryName } */
function classifyRow(r, settings) {
  const s = settings || {};
  const rules = s.rules || {};
  const charge = new Set(s.chargeNames || BS_DEFAULT_CHARGE);
  const amount = -r.amount; // 앱 기준 금액
  const cat = () => BS_CATEGORY_MAP[r.cat1] || '기타';

  if (!r.amount) return { decision: 'exclude', reason: 'zero', amount: 0 };
  if ((s.excludeMethods || []).includes(r.method)) return { decision: 'exclude', reason: 'method', amount };

  // 학습 규칙은 타입별로 본다 (정확한 이름 → 숫자를 지운 이름 순).
  // 같은 이름이 타입마다 뜻이 다르기 때문이다.
  //   '쿠팡' → 이체는 쿠팡캐시 충전, 지출은 실제 결제
  const rule = rules[ruleKey(r.type, r.content)] || rules[ruleKey(r.type, normalizeName(r.content))];
  if (rule) {
    if (rule.kind === 'exclude') return { decision: 'exclude', reason: 'rule', amount };
    return { decision: 'record', reason: 'rule', amount, categoryName: rule.categoryName || cat() };
  }

  // 간편결제 충전도 타입과 무관하게 뺀다.
  // 뱅크샐러드가 같은 '네이버페이충전'을 이체 30건 / 지출 15건으로 흩어 놓기 때문이다.
  // 실제 지출은 결제 행에 따로 있어서 여기서 잡으면 이중 계상된다.
  if (charge.has(r.content)) return { decision: 'exclude', reason: 'charge', amount };

  if (r.type === '지출') {
    // 대분류 '금융'은 실제 소비가 아닌 것이 섞여 있어 소분류로 다시 나눈다
    if (r.cat1 === '금융') {
      if (BS_FINANCE_SKIP.includes(r.cat2)) return { decision: 'exclude', reason: 'invest', amount };
      if (BS_BANK_ASK.includes(r.content)) return { decision: 'pending', reason: 'cash', amount, categoryName: '기타' };
    }
    // 특별지출 기준 금액 이상은 사람이 한 번 본다. 수동 입력의 "특별지출로 분류할까요?"와 같은 질문이다.
    // 한 번에 수십 건이 들어오므로 저장하면서 물을 수 없어 확인 대기함으로 보낸다. (1년에 6건뿐이었다)
    if (amount >= (s.specialThreshold ?? 0) && (s.specialThreshold ?? 0) > 0) {
      return { decision: 'pending', reason: 'big-spend', amount, categoryName: cat() };
    }
    return { decision: 'record', reason: r.amount > 0 ? 'refund' : 'expense', amount, categoryName: cat() };
  }
  if (r.type === '이체') {
    if (BS_SELF_TRANSFER.includes(r.cat1)) return { decision: 'exclude', reason: 'self-transfer', amount };
    if (Math.abs(r.amount) < (s.minTransfer ?? BS_MIN_TRANSFER)) return { decision: 'exclude', reason: 'tiny', amount };
    if (Math.abs(r.amount) >= (s.bigTransfer ?? BS_BIG_TRANSFER)) return { decision: 'pending', reason: 'big-transfer', amount, categoryName: cat() };
    // 남은 것은 타인과 주고받은 돈. 보냈으면 지출, 받았으면 환급 (부호가 알아서 갈라 준다)
    return { decision: 'record', reason: r.amount < 0 ? 'sent' : 'received', amount, categoryName: cat() };
  }
  if (r.type === '수입') return { decision: 'exclude', reason: 'income', amount };
  return { decision: 'pending', reason: 'unknown-type', amount, categoryName: '기타' };
}

/** 파일 전체를 훑어 요약을 만든다. doneIds: 이미 가져온 행 id 집합 */
function planImport(rows, settings, doneIds) {
  const done = doneIds || new Set();
  const out = { record: [], pending: [], exclude: [], already: [], from: null, to: null, methods: new Set() };
  rows.forEach(r => {
    const id = rowId(r);
    if (!out.from || r.date < out.from) out.from = r.date;
    if (!out.to || r.date > out.to) out.to = r.date;
    out.methods.add(r.method);
    if (done.has(id)) { out.already.push({ r, id }); return; }
    const c = classifyRow(r, settings);
    out[c.decision === 'record' ? 'record' : c.decision === 'pending' ? 'pending' : 'exclude'].push({ r, id, ...c });
  });
  out.methods = [...out.methods].sort();
  out.spend = out.record.filter(x => x.amount > 0).reduce((s, x) => s + x.amount, 0);
  out.refund = out.record.filter(x => x.amount < 0).reduce((s, x) => s + x.amount, 0);
  return out;
}

/* ---- 가져온 행 → 지출 내역 ---- */
/** 카테고리 이름으로 id를 찾는다. 없으면 '기타' */
function catIdByName(cats, name, fallbackId) {
  const c = cats.find(x => x.name === name);
  return c ? c.id : fallbackId;
}
/** 가져온 행 하나를 지출 내역으로 바꾼다.
 *  amount는 음수일 수 있다 (취소·환불, N빵 받은 돈). kind는 확인 대기함에서 정한 값이 있으면 그것을 쓴다. */
function makeImportTx(x, cats, threshold, fallbackId, id, now, kind) {
  const categoryId = catIdByName(cats, x.categoryName || '기타', fallbackId);
  const base = {
    id, amount: x.amount, categoryId, merchant: x.r.content, date: x.r.date, time: x.r.time,
    method: 'import', importRowId: x.id, status: 'active', eventId: null,
    kind: 'living', kindSource: 'auto', createdAt: now, updatedAt: now,
  };
  if (kind) return { ...base, kind, kindSource: 'asked' };
  const catMap = Object.fromEntries(cats.map(c => [c.id, c]));
  return recomputeKind(base, catMap, threshold);
}
/** 확인 대기함에 보여줄 설명 */
const PENDING_WHY = {
  'big-transfer': '30만원 이상 이체예요. 어디에 넣을까요?',
  'big-spend': '큰 지출이에요. 특별지출로 분류할까요?',
  cash: '현금 인출이에요. 어디에 넣을까요?',
  'unknown-type': '어떻게 처리할지 모르겠어요',
};
/** 가져오기 묶음 요약 문구용 숫자 */
function importSummary(plan) {
  return {
    from: plan.from, to: plan.to,
    record: plan.record.length, spend: plan.spend, refund: plan.refund,
    exclude: plan.exclude.length, pending: plan.pending.length, already: plan.already.length,
  };
}
/** 가져온 내역 중 가장 최근 날짜 (다음에 언제부터 받으면 되는지 안내용) */
function lastImported(rows) {
  let last = null;
  rows.forEach(r => { if (!last || r.date > last) last = r.date; });
  return last;
}

/* =====================================================================
   4단계 (v4.0.0) — 여행·이벤트 / 반기 특별지출 한도 / 수입·안 쓴 돈
   ===================================================================== */

/* ---- 여행·이벤트 ----
   이벤트 태그는 날짜만 보고 붙인다. 가져온 내역도, 여행이 끝난 뒤 늦게 들어온 것도 포함한다.
   파일은 늦게 들어오는 게 정상이기 때문이다.
   기간이 겹치면 나중에 만든 이벤트가 이긴다 (한 지출에 이벤트는 하나).
   eventSource='manual' = 사용자가 그 건만 직접 붙이거나 뗀 것 → 다시 계산하지 않는다. */
function eventForDate(events, ymd) {
  const hit = (events || []).filter(e => inRange(ymd, e.start, e.end));
  if (!hit.length) return null;
  return hit.reduce((a, b) => (b.createdAt > a.createdAt ? b : a));
}
/** 내역 하나에 붙을 이벤트 id (직접 바꾼 건은 그대로) */
function eventIdFor(t, events) {
  if (t.eventSource === 'manual') return t.eventId || null;
  const e = eventForDate(events, t.date);
  return e ? e.id : null;
}
/** 이벤트를 만들거나 기간을 바꾸거나 지웠을 때 태그를 다시 계산한다. 바뀐 내역만 반환.
 *  events에는 이미 반영된 목록(추가·수정된 것 포함, 지운 것 제외)을 넘긴다. */
function retagEvents(txs, events, catMap, threshold, now) {
  const out = [];
  txs.forEach(t => {
    if (t.eventSource === 'manual') return;
    const want = eventIdFor(t, events);
    if ((t.eventId || null) === want) return;
    out.push({ ...recomputeKind({ ...t, eventId: want }, catMap, threshold), eventSource: 'auto', updatedAt: now });
  });
  return out;
}
/** 카테고리 비중 (도넛에는 양수만. 환급이 더 많은 카테고리는 따로 모은다) */
function catBreakdown(list, categories) {
  const byCat = {};
  list.forEach(t => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + t.amount; });
  const total = sumAmount(list);
  const catRows = categories
    .map(k => ({ cat: k, spent: byCat[k.id] || 0, share: total > 0 ? (byCat[k.id] || 0) / total : 0 }))
    .filter(r => r.spent > 0)
    .sort((a, b) => b.spent - a.spent || a.cat.order - b.cat.order);
  const negRows = categories
    .map(k => ({ cat: k, spent: byCat[k.id] || 0 }))
    .filter(r => r.spent < 0)
    .sort((a, b) => a.spent - b.spent);
  return { total, catRows, negRows };
}
/** 이벤트 상세: 총액(환급 반영) · 하루 평균 · 카테고리 비중 */
function eventStats(txs, ev, categories) {
  const list = txs.filter(t => isCounted(t) && t.eventId === ev.id);
  const b = catBreakdown(list, categories || []);
  const days = diffDays(ev.start, ev.end) + 1;
  const spend = sumAmount(list.filter(t => t.amount > 0));
  const refund = sumAmount(list.filter(t => t.amount < 0));
  return {
    event: ev, days, count: list.length,
    total: b.total, spend, refund,
    avgDaily: days > 0 ? Math.round(b.total / days) : 0,
    catRows: b.catRows, negRows: b.negRows,
    rest: Math.max(0, (ev.estimate || 0) - b.total),
  };
}
/** 이벤트 목록 (최근 시작일 순). 각 항목에 총액·건수를 붙인다 */
function eventList(txs, events) {
  return [...(events || [])]
    .sort((a, b) => b.start.localeCompare(a.start))
    .map(e => {
      const list = txs.filter(t => isCounted(t) && t.eventId === e.id);
      return { event: e, count: list.length, total: sumAmount(list) };
    });
}

/* ---- 반기 특별지출 한도 ----
   특별지출은 1년에 큰 건 몇 개가 전부를 설명한다. 페이스·하루 사용 가능 금액은 의미가 없어서 쓰지 않는다.
   대신 잔액 · 건수와 건당 평균 · 예정(이벤트 예상액) · 큰 건 · 주기별 분포를 본다. */
/** 반기 안에 걸친 이벤트의 남은 예상액. 실제 지출이 들어오면 그만큼 물러난다 */
function plannedSpecial(txs, events, h) {
  const items = (events || [])
    .filter(e => (e.estimate || 0) > 0 && e.start <= h.end && e.end >= h.start)
    .map(e => {
      const actual = sumAmount(txs.filter(t => isSpecial(t) && t.eventId === e.id && inRange(t.date, h.start, h.end)));
      return { event: e, actual, rest: Math.max(0, e.estimate - actual) };
    })
    .filter(x => x.rest > 0)
    .sort((a, b) => a.event.start.localeCompare(b.event.start));
  return { items, total: items.reduce((s, x) => s + x.rest, 0) };
}
/** 반기 안 주기별 특별지출 (막대 분포용) */
function monthlySpecial(list, h) {
  const out = [];
  let c = cycleOf(h.start);
  while (c.start <= h.end) {
    const cc = c;
    out.push({ cycle: cc, amount: sumAmount(list.filter(t => inRange(t.date, cc.start, cc.end))) });
    c = nextCycle(c);
  }
  return out;
}
/** 반기 안 '끝난' 주기별 생활비 결과 (v4.0.2).
 *  예산이 있는 주기만 센다 (기준이 없으면 넘쳤는지 알 수 없다).
 *  over = 넘친 금액의 합. 아낀 돈은 더하지 않는다 — 아낀 돈은 저축으로 남긴다.
 *  주기 중간에는 매일 흔들리므로 끝난 주기(end < today)만 본다. */
function livingOverrun(txs, budgets, h, today) {
  const items = [];
  let c = cycleOf(h.start);
  while (c.start <= h.end) {
    const cc = c;
    const rec = (budgets || {})[cc.id];
    if (cc.end < today && rec && rec.amount > 0) {
      const living = sumAmount(txs.filter(t => isLiving(t) && inRange(t.date, cc.start, cc.end)));
      items.push({ cycle: cc, budget: rec.amount, living, diff: living - rec.amount });
    }
    c = nextCycle(c);
  }
  return { items, over: items.reduce((s, x) => s + Math.max(0, x.diff), 0) };
}
/** 반기 특별지출 현황 전부. limit이 없으면 합계와 분포만 낸다.
 *  overrun = 생활비 초과분. 한도에서 빼서 '실제로 쓸 수 있는 돈'(effLimit)을 기준으로 남은 돈·비율·경고를 낸다 (v4.0.2) */
function halfStats(txs, events, categories, ref, limit, overrun = 0) {
  const h = halfOf(ref);
  const base = limit || null;
  const eff = base !== null ? base - (overrun || 0) : null;
  const list = txs.filter(t => isSpecial(t) && inRange(t.date, h.start, h.end));
  const spent = sumAmount(list);
  const count = list.length;
  const avgEach = count > 0 && spent > 0 ? Math.round(spent / count) : 0;
  const planned = plannedSpecial(txs, events, h);
  const projected = spent + planned.total;
  const ph = halfOf(addDays(h.start, -1));
  const elapsed = diffDays(h.start, ref) + 1;
  const pSameEnd = [addDays(ph.start, elapsed - 1), ph.end].sort()[0];
  const prevSame = sumAmount(txs.filter(t => isSpecial(t) && inRange(t.date, ph.start, pSameEnd)));
  const prevTotal = sumAmount(txs.filter(t => isSpecial(t) && inRange(t.date, ph.start, ph.end)));
  const pos = list.filter(t => t.amount > 0);
  const gross = sumAmount(pos);
  const top = [...pos].sort((a, b) => b.amount - a.amount).slice(0, 3);
  const topSum = sumAmount(top);
  const has = eff !== null;
  const pctOf = v => (eff > 0 ? Math.round(v / eff * 100) : (v > 0 ? 100 : 0));
  return {
    half: h, prevHalf: ph, elapsed, limit: base, overrun: overrun || 0, effLimit: eff,
    spent, count, avgEach,
    left: has ? eff - spent : null,
    pct: has ? pctOf(spent) : null,
    planned, projected,
    projectedLeft: has ? eff - projected : null,
    projectedPct: has ? pctOf(projected) : null,

    leftCount: has && avgEach > 0 ? Math.floor(Math.max(0, eff - projected) / avgEach) : null,
    gross, top, topShare: gross > 0 ? topSum / gross : 0,

/** 반기를 앞뒤로 옮긴다. 이번 반기로 돌아오면 null */

  const n = dir < 0 ? halfOf(addDays(h.start, -1)) : halfOf(addDays(h.end, 1));
  if (inRange(today, n.start, n.end)) return null;
  return n.end;
}

function earliestHalf(txs, today) {
  const d = txs.filter(isSpecial).map(t => t.date).sort()[0];
  return halfOf(d || today);
}

/* ---- 수입 · 안 쓴 돈 · 저축률 ----
   계좌 잔고는 알 수 없다 (가져오기에서 내계좌이체·저축·투자를 전부 뺐다).
   그래서 '저축'이 아니라 '안 쓴 돈'으로 부른다. = 수입 − (생활비 + 그 주기 특별지출) */
/** 그 주기 수입. 주기에 기록이 없으면 기본 급여를 소급 적용하고 estimated=true를 붙인다 */
function cycleIncome(incomes, cycleId, baseSalary) {
  const rec = (incomes || {})[cycleId];
  const has = !!(rec && rec.salary != null);
  const salary = has ? rec.salary : (baseSalary || 0);
  const extras = (rec && rec.extras) || [];
  const extra = extras.reduce((s, x) => s + (x.amount || 0), 0);
  return { cycleId, salary, extras, extra, total: salary + extra, estimated: !has };
}
/** 한 주기의 안 쓴 돈. 특별지출은 그 주기에 실제로 발생한 것만 뺀다 */
function cycleSaving(txs, incomes, cycleId, baseSalary) {
  const [y, m] = cycleId.split('-').map(Number);
  const c = cycleOf(`${y}-${pad(m)}-${pad(PAYDAY)}`);
  const income = cycleIncome(incomes, cycleId, baseSalary);
  const living = sumAmount(txs.filter(t => isLiving(t) && inRange(t.date, c.start, c.end)));
  const special = sumAmount(txs.filter(t => isSpecial(t) && inRange(t.date, c.start, c.end)));
  const spent = living + special;
  const saved = income.total - spent;
  return { cycle: c, income, living, special, spent, saved, rate: income.total > 0 ? saved / income.total : null };
}
/** 이미 끝난 주기 최근 n개의 안 쓴 돈 평균. sinceYMD보다 앞으로는 가지 않는다 */
function savingTrend(txs, incomes, today, baseSalary, sinceYMD, n = 3) {
  const floor = sinceYMD || txs.map(t => t.date).sort()[0] || today;
  const out = [];
  let c = prevCycle(cycleOf(today));
  while (out.length < n && c.end >= floor) {
    const r = cycleSaving(txs, incomes, c.id, baseSalary);
    if (r.income.total > 0) out.push(r);
    c = prevCycle(c);
  }
  if (!out.length) return null;
  const avgSaved = Math.round(out.reduce((s, r) => s + r.saved, 0) / out.length);
  const avgIncome = Math.round(out.reduce((s, r) => s + r.income.total, 0) / out.length);
  const avgSpent = Math.round(out.reduce((s, r) => s + r.spent, 0) / out.length);
  return {
    count: out.length, cycles: out, avgSaved, avgIncome, avgSpent,
    rate: avgIncome > 0 ? avgSaved / avgIncome : null, yearly: avgSaved * 12,
  };
}

/* ---- 예산 짜기 ----
   목표 저축률이 '쓸 수 있는 돈'을 먼저 정하고, 그 안에서 생활비와 특별지출을 나눈다.

function suggestHalfLimit(income, goalRate, living) {

function budgetChoices(income, goalRate, halfLimit, suggestion) {

function openDB() {

/** 도넛. selId가 있으면 그 조각만 진하게 보여주고 가운데도 그 카테고리로 바꾼다 */
function donutSVG(rows, selId) {
  const r = 66, sw = 22, C = 2 * Math.PI * r;
  const parts = rows.filter(x => x.spent > 0);
  let segs = '';
  if (!parts.length) {
    segs = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>`;
  } else {
    const gap = parts.length > 1 ? 2 : 0;
    let offset = 0;
    parts.forEach(x => {
      const len = Math.max(0, x.share * C - gap);
      const on = x.cat.id === selId;
      segs += `<circle class="donut-seg ${on ? 'on' : ''}" data-seg="${x.cat.id}" cx="90" cy="90" r="${r}" fill="none"
        stroke="${x.cat.color}" stroke-width="${on ? sw + 6 : sw}"
        stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"><title>${esc(x.cat.name)}</title></circle>`;
      offset += x.share * C;
    });
  }
  const pick = parts.find(x => x.cat.id === selId) || parts[0];
  const center = pick
    ? `<text x="90" y="80" text-anchor="middle" class="donut-center-k">${esc(pick.cat.emoji)} ${esc(pick.cat.name)}</text>
       <text x="90" y="102" text-anchor="middle" class="donut-center-v num">${Math.round(pick.share * 100)}%</text>
       <text x="90" y="120" text-anchor="middle" class="donut-center-k num">${formatMan(pick.spent)}${pick.spent >= 10000 ? '' : ''}</text>`
    : `<text x="90" y="95" text-anchor="middle" class="donut-center-k">아직 생활비 지출이 없어요</text>`;
  return `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="생활비 카테고리별 비중">${segs}${center}</svg>`;
}

/* ---- 누적 지출 선 그래프 ---- */
const PC = { W: 320, H: 150, top: 16, bottom: 124 };
function pcScale(series, budget, total) {
  const ymax = Math.max(budget || 0, series[series.length - 1] || 0) * 1.08 || 1;
  return {
    x: day => day / total * PC.W,
    y: v => PC.bottom - Math.max(0, v) / ymax * (PC.bottom - PC.top),
  };
}
/** 누적 지출 선 그래프. budget이 없으면 점선(예산 페이스)을 빼고 그린다.
 *  isCurrent=false면 끝점 라벨이 '오늘'이 아니라 주기 마지막 날이다 (v3.1.0) */
function paceChartSVG(series, budget, total, c, isCurrent) {
  const p = { total };
  const { x, y } = pcScale(series, budget, total);
  const pts = [[0, y(0)], ...series.map((v, i) => [x(i + 1), y(v)])];
  const line = pts.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');
  const area = `${line}L${pts[pts.length - 1][0].toFixed(1)},${PC.bottom}L0,${PC.bottom}Z`;
  const [tx, ty] = pts[pts.length - 1];
  const edge = tx / PC.W;
  const lab = (xx, anchor, text) => `<text x="${xx}" y="${PC.H - 6}" text-anchor="${anchor}" class="pc-axis num">${text}</text>`;
  const endLab = isCurrent ? '오늘' : shortDate(addDays(c.start, series.length - 1));
  return `<svg viewBox="0 0 ${PC.W} ${PC.H}" role="img" aria-label="누적 생활비 ${formatWon(series[series.length - 1] || 0)}원">
    <line x1="0" x2="${PC.W}" y1="${PC.bottom}" y2="${PC.bottom}" class="pc-base"/>
    ${budget ? `<line x1="0" y1="${y(0)}" x2="${PC.W}" y2="${y(budget)}" class="pc-pace"/>
    <text x="${PC.W}" y="${y(budget) - 6}" text-anchor="end" class="pc-budget num">예산 ${formatMan(budget)}</text>` : ''}
    <path d="${area}" class="pc-area"/>
    <path d="${line}" class="pc-line"/>
    <line id="pc-scrub" x1="0" x2="0" y1="${PC.top}" y2="${PC.bottom}" class="pc-scrub"/>
    <circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5" class="pc-dot" id="pc-dot"/>
    ${edge > 0.16 ? lab(0, 'start', shortDate(c.start)) : ''}
    ${lab(Math.min(PC.W - 20, Math.max(20, tx)), 'middle', endLab)}
    ${edge < 0.8 ? lab(PC.W, 'end', shortDate(c.end)) : ''}
    <rect x="0" y="0" width="${PC.W}" height="${PC.H}" fill="transparent" id="pc-hit"/>
  </svg>`;
}
function bindPaceChart(series, budget, total, c, isCurrent) {
  const svg = $('#pace-chart svg'), hit = $('#pc-hit'), scrub = $('#pc-scrub'), dot = $('#pc-dot'), out = $('#pc-readout');
  if (!svg) return;
  const p = { total };
  const { x, y } = pcScale(series, budget, total);
  const show = i => {
    const v = series[i];
    const isToday = i === series.length - 1;
    const day = isToday && isCurrent ? '오늘' : shortDate(addDays(c.start, i));
    out.innerHTML = budget
      ? `${day} · 누적 <b>${formatWon(v)}원</b> · 적정 ${formatWon(roundTo(budget * (i + 1) / total, 1000))}원`
      : `${day} · 누적 <b>${formatWon(v)}원</b>`;
    dot.setAttribute('cx', x(i + 1)); dot.setAttribute('cy', y(v));
    scrub.setAttribute('x1', x(i + 1)); scrub.setAttribute('x2', x(i + 1));
    scrub.classList.toggle('on', !isToday);
  };
  const at = e => {
    const r = svg.getBoundingClientRect();
    const day = Math.round((e.clientX - r.left) / r.width * p.total);
    show(Math.max(0, Math.min(series.length - 1, day - 1)));
  };
  hit.addEventListener('pointerdown', at);
  hit.addEventListener('pointermove', e => { if (e.pressure > 0 || e.pointerType === 'mouse') at(e); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hit.addEventListener(ev, () => show(series.length - 1)));
  show(series.length - 1);
}
function gapText(gap) {
  if (Math.abs(gap) < 1000) return '적정 금액만큼 썼어요';
  const g = Math.abs(gap);
  const amt = g >= 100000 ? `${formatWon(Math.round(g / 10000))}만원` : g >= 10000 ? `${formatMan(g)}원` : `${formatWon(g)}원`;
  return gap > 0 ? `적정보다 ${amt} 더 썼어요` : `적정보다 ${amt} 덜 썼어요`;
}

        <div class="legend"><span><i></i>누적 지출</span>${budget ? '<span><i class="dash"></i>예산 페이스</span>' : ''}</div>
      </div>
      ${bottom}
      <div class="delta-line">${delta}</div>
    </section>`;

  $('#view').innerHTML = `
    <div class="topbar"><h1>홈</h1><button class="icon-btn" id="open-settings" aria-label="설정">${ICON.gear}</button></div>
    ${pend ? `<div class="badge-card pressable" id="go-pending">
      <span style="font-size:24px">📋</span>
      <span class="grow"><b>확인할 내역 ${pend}건</b><small>가져온 파일에서 판단이 필요해요</small></span>
      ${ICON.chev}</div>` : ''}
    ${due ? `<div class="due-card ${due.level} pressable" id="go-import">
      <span style="font-size:24px">📄</span>
      <span class="grow"><b>${due.level === 'late' ? `${Math.floor(due.days / 7)}주째 가져오지 않았어요` : '파일 가져올 때가 됐어요'}</b>
        <small>마지막 가져오기 ${esc(dateLabel(due.ymd))} · ${due.days}일 전</small></span>
      ${ICON.chev}</div>` : ''}
    ${isCurrent ? budgetCardHTML(bNow) : ''}
    ${gauge}
    <div class="stats two">
      <div class="stat"><div class="k">특별지출 · ${s.half.label}</div>
        <div class="v num ${hl0 && s.special >= hl && (s.special > 0 || hl <= 0) ? 'neg' : ''}">${formatWon(s.special)}원</div>
        <div class="k2 num">${hl0 ? `${hlOver ? '쓸 수 있는' : '한도'} ${formatMan(Math.max(0, hl))} · ${hl > 0 ? Math.round(s.special / hl * 100) : 100}%` : `${shortDate(s.half.start)} – ${shortDate(s.half.end)}`}</div></div>
      ${isCurrent
        ? `<div class="stat"><div class="k">오늘 쓴 돈</div><div class="v num">${formatWon(s.today)}원</div><div class="k2">생활비 + 특별지출</div></div>`
        : `<div class="stat"><div class="k">하루 평균</div><div class="v num">${formatWon(s.avgDaily)}원</div><div class="k2">생활비 ${s.elapsed}일 기준</div></div>`}
    </div>
    <section class="section">
      <h2 class="section-title">생활비 카테고리</h2>
      <div id="cat-section">${catSectionHTML(s)}</div>
    </section>
    ${up.length ? `<section class="section">
      <div class="sec-head"><h2 class="section-title">다가오는 출금</h2><button class="link-btn" id="go-fixed">전체 보기</button></div>
      ${up.map(x => fixedRowHTML(x, 'home')).join('')}

    state.homeRef = shiftCycleRef(ref, Number(b2.dataset.cyc), today);

    renderHome();
