/* =====================================================================
   화면: 내역
   ===================================================================== */
function kindLabels(t) {
  let s = '';
  if (t.kind === 'special') s += '<span class="label special">특별</span>';
  return s;
}
const txSource = t => (t.method === 'fixed-auto' ? '자동 기록' : t.method === 'import' ? '가져옴' : null);
function txRowHTML(t, selecting, selected) {
  const c = catById(t.categoryId);
  const src = txSource(t);
  return `<div class="tx ${t.status === 'canceled' ? 'canceled' : ''}" data-tx="${t.id}">
      ${selecting ? `<span class="ck ${selected ? 'on' : ''}">${ICON.check}</span>` : ''}
      <div class="cat-ico" style="${icoStyle(c)}">${esc(c.emoji)}</div>
      <div class="tx-main"><div class="tx-title">${esc(t.merchant || c.name)}${kindLabels(t)}</div>
        <div class="tx-sub">${src ? esc(src) : `<span class="num">${t.time}</span>`} · ${esc(c.name)}${t.status === 'canceled' ? ' · 취소됨' : ''}</div></div>
      <div class="tx-amt num ${t.amount < 0 ? 'refund' : ''}">${formatWon(t.amount)}원</div>
    </div>`;
}

/** 지금 화면 조건(주기·카테고리·검색)에 맞는 내역 */
function visibleTxs() {
  return filterTxList(state.txs, {
    cycleId: state.cycleFilter, catId: state.filterCat, special: state.filterSpecial, q: state.query,
  });
}

function renderList() {
  const list = visibleTxs();
  const selecting = state.selMode;
  const sel = new Set(state.sel);
  document.body.classList.toggle('sel-mode', selecting);

  const groups = [];
  list.forEach(t => {
    const last = groups[groups.length - 1];
    if (last && last.date === t.date) last.items.push(t); else groups.push({ date: t.date, items: [t] });
  });

  const body = groups.map(g => {
    const allOn = g.items.every(t => sel.has(t.id));
    return `
    <section class="section" style="padding:14px 12px">
      <div class="day-head">
        ${selecting ? `<span class="ck ${allOn ? 'on' : ''}" data-day-ck="${g.date}">${ICON.check}</span>` : ''}
        <span class="grow">${dateLabel(g.date)}</span><span class="num">${formatWon(sumAmount(g.items.filter(isCounted)))}원</span></div>
      ${g.items.map(t => txRowHTML(t, selecting, sel.has(t.id))).join('')}
    </section>`;
  }).join('');

  const cycles = cyclesInData(state.txs, todayYMD());
  const cycleChips = [{ id: 'all', name: '전체' }, ...cycles.map(c => ({ id: c.id, name: c.name }))]
    .map(c => `<button class="chip ${state.cycleFilter === c.id ? 'on' : ''}" data-cycle="${c.id}">${esc(c.name)}</button>`).join('');
  // ✦ 특별지출 칩은 카테고리와 따로 켜고 끈다 (특별지출 + 쇼핑처럼 같이 걸 수 있다) (v4.0.2)
  const chips = `<button class="chip chip-sp ${state.filterSpecial ? 'on' : ''}" id="f-special" aria-pressed="${state.filterSpecial}">✦ 특별지출</button>`
    + [{ id: 'all', name: '전체', emoji: '' }, ...state.cats]
      .map(c => `<button class="chip ${state.filterCat === c.id ? 'on' : ''}" data-filter="${c.id}">${c.emoji ? esc(c.emoji) + ' ' : ''}${esc(c.name)}</button>`).join('');
  // 목록 위 한 줄: 주기를 고르면 그 기간, 특별지출을 켜면 건수와 합계
  const selCycle = state.cycleFilter !== 'all' ? cycles.find(c => c.id === state.cycleFilter) : null;
  const sm = listSummary(list);
  const sumParts = [
    selCycle ? `${shortDate(selCycle.start)} – ${shortDate(selCycle.end)}` : '',
    state.filterSpecial ? `특별지출 ${sm.count}건 · ${formatWon(sm.total)}원` : '',
  ].filter(Boolean);
  const sumLine = sumParts.length ? `<div class="list-sum num">${sumParts.join(' · ')}</div>` : '';

  const selTotal = sumAmount(state.txs.filter(t => sel.has(t.id) && isCounted(t)));
  const head = selecting
    ? `<div class="selbar">
         <button class="text-btn" id="sel-cancel">취소</button>
         <span class="mid">${state.sel.length}건 선택<small class="num">${formatWon(selTotal)}원</small></span>
         <button class="text-btn" id="sel-all">${list.length && list.every(t => sel.has(t.id)) ? '선택 해제' : '전체'}</button>
       </div>`
    : `<div class="topbar"><h1>내역</h1>${state.txs.length ? '<button class="text-btn" id="sel-start">선택</button>' : ''}</div>`;

  const searchFocused = document.activeElement && document.activeElement.id === 'q';
  $('#view').innerHTML = `
    ${head}
    <div class="search">${ICON.search}<input id="q" type="search" placeholder="가맹점 검색" value="${esc(state.query)}" autocomplete="off"></div>
    <div class="cycle-chips">${cycleChips}</div>
    <div class="chips">${chips}</div>
    ${sumLine}
    <div id="list-body">${body || `<div class="empty" style="padding-top:60px">${state.query || state.filterCat !== 'all' || state.cycleFilter !== 'all' || state.filterSpecial ? '조건에 맞는 내역이 없어요' : '아직 기록된 내역이 없어요'}</div>`}</div>
    ${selecting ? `<div class="actbar">
      <button id="act-cat" ${state.sel.length ? '' : 'disabled'}>카테고리</button>
      <button id="act-kind" ${state.sel.length ? '' : 'disabled'}>특별지출</button>
      <button id="act-del" class="danger" ${state.sel.length ? '' : 'disabled'}>삭제</button>
    </div>` : ''}`;

  const qi = $('#q');
  if (qi) {
    qi.oninput = () => { state.query = qi.value; renderList(); };
    if (searchFocused) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  }
  $('#view').querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => { state.cycleFilter = b.dataset.cycle; renderList(); });
  $('#view').querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { state.filterCat = b.dataset.filter; renderList(); });
  $('#f-special').onclick = () => { state.filterSpecial = !state.filterSpecial; renderList(); };

  if (!selecting) {
    const st = $('#sel-start');
    if (st) st.onclick = () => { state.selMode = true; state.sel = []; renderList(); };
    $('#view').querySelectorAll('[data-tx]').forEach(el => el.onclick = () => openEntry(state.txs.find(t => t.id === el.dataset.tx)));
    return;
  }

  const toggle = ids => {
    const s2 = new Set(state.sel);
    const allOn = ids.every(id => s2.has(id));
    ids.forEach(id => (allOn ? s2.delete(id) : s2.add(id)));
    state.sel = [...s2];
    renderList();
  };
  $('#view').querySelectorAll('[data-tx]').forEach(el => el.onclick = () => toggle([el.dataset.tx]));
  $('#view').querySelectorAll('[data-day-ck]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    toggle(list.filter(t => t.date === el.dataset.dayCk).map(t => t.id));
  });
  $('#sel-cancel').onclick = () => { state.selMode = false; state.sel = []; renderList(); };
  $('#sel-all').onclick = () => {
    state.sel = list.every(t => sel.has(t.id)) ? [] : list.map(t => t.id);
    renderList();
  };
  $('#act-cat').onclick = () => openBulkCategory();
  $('#act-kind').onclick = () => openBulkKind();
  $('#act-del').onclick = () => bulkDelete();
}

/* ---- 일괄 작업 ---- */
async function afterBulk(changed, msg) {
  await dbPutMany('transactions', changed);
  const byId = Object.fromEntries(changed.map(t => [t.id, t]));
  state.txs = state.txs.map(t => byId[t.id] || t);
  state.selMode = false; state.sel = [];
  renderList(); toast(msg);
}
function openBulkCategory() {
  const n = state.sel.length;
  const s = openSheet(`
    <div class="sheet-head"><button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">카테고리 바꾸기</div><span style="width:44px"></span></div>
    <div class="hint" style="text-align:center;margin:0 0 6px">고른 ${n}건을 옮길 카테고리를 고르세요</div>
    <div class="cat-grid" style="grid-template-columns:repeat(${Math.max(5, Math.ceil(state.cats.length / 2))},70px)">
      ${state.cats.map(c => `<button class="cat-opt" data-cat="${c.id}"><div class="cat-ico" style="${icoStyle(c)}">${esc(c.emoji)}</div>${esc(c.name)}</button>`).join('')}
    </div>`);
  s.el.querySelectorAll('[data-cat]').forEach(b => b.onclick = async () => {
    const cat = state.cats.find(c => c.id === b.dataset.cat);
    const changed = bulkSetCategory(state.txs, state.sel, cat.id, catMap(), state.threshold, Date.now());
    s.close();
    try { await afterBulk(changed, `${changed.length}건을 '${cat.name}'으로 옮겼어요`); }
    catch (e) { toast('바꾸지 못했어요'); }
  });
}
function openBulkKind() {
  const n = state.sel.length;
  const s = openSheet(`
    <div class="choice-q">${n}건을 어떻게 분류할까요?</div>
    <div class="choice-d">특별지출은 생활비 게이지에서 빠지고 반기 합계로만 보여요. 여기서 직접 바꾼 건은 규칙이 바뀌어도 그대로 유지돼요.</div>
    <div class="choice-btns">
      <button class="primary" data-kind="special">특별지출로</button>
      <button class="secondary" data-kind="living">생활비로</button>
    </div>`);
  s.el.querySelectorAll('[data-kind]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.kind;
    const changed = bulkSetKind(state.txs, state.sel, kind, Date.now());
    s.close();
    try { await afterBulk(changed, `${changed.length}건을 ${kind === 'special' ? '특별지출' : '생활비'}로 바꿨어요`); }
    catch (e) { toast('바꾸지 못했어요'); }
  });
}
async function bulkDelete() {
  const ids = [...state.sel];
  if (!ids.length) return;
  if (!confirm(`내역 ${ids.length}건을 삭제할까요?\n되돌릴 수 없어요.`)) return;
  try { await dbDeleteMany('transactions', ids); } catch (e) { toast('삭제하지 못했어요'); return; }
  const gone = new Set(ids);
  state.txs = state.txs.filter(t => !gone.has(t.id));
  // 가져온 건을 지우면 그 행도 '건너뜀'으로 바꿔 다시 들어오지 않게 한다
  const rows = state.importRows.filter(r => r.transactionId && gone.has(r.transactionId));
  if (rows.length) {
    const upd = rows.map(r => ({ ...r, status: 'skipped', transactionId: null }));
    try { await dbPutMany('importRows', upd); } catch (e) {}
    const byId = Object.fromEntries(upd.map(r => [r.id, r]));
    state.importRows = state.importRows.map(r => byId[r.id] || r);
  }
  state.selMode = false; state.sel = [];
  renderList(); toast(`${ids.length}건을 삭제했어요`);
}

/* =====================================================================
   화면: 고정지출
   v3.0.0: 출금일에 지출을 스스로 기록하지 않는다. 실제 기록은 파일 가져오기가 담당한다.
           이 탭은 "언제 얼마가 나가는지" 미리 보는 달력이다.
   ===================================================================== */
const mdLabel = ymd => { const d = parseYMD(ymd); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`; };
const ddayText = n => (n === 0 ? '오늘' : `D-${n}`);
const calAmt = n => (n >= 10000 ? formatMan(n) : formatWon(n));
const fixedSub = f => `매월 ${payDayLabel(f.payDay)} · ${f.method === 'card' ? '카드' : '계좌'}`;

/** mode: 'list'(완료 여부 표시) / 'home'(날짜와 D-day) */
function fixedRowHTML(x, mode) {
  const f = x.f, c = catById(f.categoryId);
  const sub = mode === 'home' ? `${mdLabel(x.date)} · ${ddayText(x.dday)}${f.method === 'card' ? ' · 카드' : ''}` : fixedSub(f);
  const st = mode === 'home' ? '' : x.done ? '<div class="fx-st done">✓ 출금됨</div>' : `<div class="fx-st num">${ddayText(x.dday)}</div>`;
  return `<div class="tx fx-row ${x.done ? 'done' : ''}" data-fixed="${f.id}">
    <div class="cat-ico" style="${icoStyle(c)}">${esc(c.emoji)}</div>
    <div class="tx-main"><div class="tx-title">${esc(f.name)}</div><div class="tx-sub">${sub}</div></div>
    <div class="fx-right"><div class="tx-amt num">${formatWon(f.amount)}원</div>${st}</div>
  </div>`;
}

/** 급여 주기(25일~24일) 캘린더. 점 = 출금 항목, 지난 날은 ✓와 함께 흐리게 */
function fixedCalendarHTML(v, today) {
  const c = v.cycle, byDate = {};
  v.items.forEach(x => (byDate[x.date] = byDate[x.date] || []).push(x));
  let cells = WEEK.map(w => `<div class="cal-w">${w}</div>`).join('');
  for (let i = 0; i < parseYMD(c.start).getDay(); i++) cells += '<div></div>';
  for (let i = 0; i < cycleDays(c); i++) {
    const d = addDays(c.start, i), [, m, dd] = d.split('-').map(Number);
    const xs = byDate[d] || [], done = d <= today;
    const cls = ['cal-d', d === today && 'today', xs.length && 'has', done && 'done', state.fixedSel === d && 'sel'].filter(Boolean).join(' ');
    const mark = xs.length
      ? `<span class="cal-dots">${xs.slice(0, 3).map(() => '<i></i>').join('')}</span><span class="cal-m num">${done ? '✓' : ''}${calAmt(sumAmount(xs.map(x => x.f)))}</span>`
      : '';
    cells += `<button class="${cls}" ${xs.length ? `data-day="${d}"` : 'disabled'} aria-label="${mdLabel(d)}${xs.length ? ` 출금 ${xs.length}건` : ''}"><span class="cal-n num">${i === 0 || dd === 1 ? `${m}.${dd}` : dd}</span>${mark}</button>`;
  }
  const sel = state.fixedSel && byDate[state.fixedSel];
  const detail = sel
    ? `<div class="cal-detail"><div class="day-head"><span>${mdLabel(state.fixedSel)}</span><span class="num">${formatWon(sumAmount(sel.map(x => x.f)))}원</span></div>${sel.map(x => fixedRowHTML(x, 'list')).join('')}</div>`
    : '<div class="hint" style="text-align:center;margin-top:12px">점이 있는 날짜를 누르면 항목이 보여요</div>';
  return `<div class="cal">${cells}</div>${detail}`;
}

function renderFixed() {
  const today = todayYMD();
  const v = fixedCycleView(state.fixeds, today), c = v.cycle;
  const has = state.fixeds.length > 0;
  const top = `<div class="topbar"><h1>고정지출</h1>${has ? '<button class="text-btn" data-fixed-add>추가</button>' : ''}</div>`;
  if (!has) {
    $('#view').innerHTML = `${top}
      <div class="placeholder"><div class="big">📅</div><b>매달 나가는 돈을 등록하세요</b>통신비·보험·구독처럼 출금일이 정해진 지출<br>언제 얼마가 나가는지 미리 보여드려요
        <div style="margin:24px auto 0;max-width:240px"><button class="primary" data-fixed-add>고정지출 추가</button></div></div>`;
  } else {
    const cal = state.fixedView === 'calendar';
    $('#view').innerHTML = `${top}
      <section class="section">
        <div class="gauge-head"><span>남은 고정지출</span><span class="num">${c.name} 주기 · ${shortDate(c.start)} – ${shortDate(c.end)}</span></div>
        <div class="gauge-amt num">${formatWon(v.remaining)}<small>원</small></div>
        <div class="gauge-of num">${v.remainingCount ? `남은 ${v.remainingCount}건` : '이번 주기 출금이 모두 끝났어요'} · 주기 전체 ${formatWon(v.total)}원</div>
      </section>
      <div class="seg seg-page"><button data-fview="calendar" class="${cal ? 'on' : ''}">캘린더</button><button data-fview="list" class="${cal ? '' : 'on'}">리스트</button></div>
      <section class="section" style="padding:${cal ? '14px 8px' : '14px 12px'}">${cal ? fixedCalendarHTML(v, today) : v.items.map(x => fixedRowHTML(x, 'list')).join('')}</section>
      <div class="hint" style="margin:0 24px">실제 지출은 파일에서 가져온 내역으로 기록돼요. 이 화면은 출금 예정을 미리 보는 곳이에요.</div>`;
  }
  const el = $('#view');
  el.querySelectorAll('[data-fixed-add]').forEach(b => b.onclick = () => openFixedEditor());
  el.querySelectorAll('[data-fixed]').forEach(r => r.onclick = () => openFixedEditor(state.fixeds.find(f => f.id === r.dataset.fixed)));
  el.querySelectorAll('[data-fview]').forEach(b => b.onclick = () => {
    if (state.fixedView === b.dataset.fview) return;
    state.fixedView = b.dataset.fview;
    dbPut('meta', { key: 'fixedView', value: state.fixedView }).catch(() => {});
    renderFixed();
  });
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    state.fixedSel = state.fixedSel === b.dataset.day ? null : b.dataset.day;
    renderFixed();
  });
}

/* ---- 고정지출 추가 / 수정 ---- */
function openFixedEditor(fx) {
  const editing = !!fx;
  const today = todayYMD();
  const f = {
    amount: editing ? String(fx.amount) : '',
    name: editing ? fx.name : '',
    payDay: editing ? fx.payDay : Number(today.slice(8)),
    method: editing ? fx.method : 'account',
    cat: editing ? fx.categoryId : null,
  };
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'back'];
  const days = Array.from({ length: 31 }, (_, i) => i + 1);
  const s = openSheet(`
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">${editing ? '고정지출 수정' : '고정지출 추가'}</div>
      ${editing ? '<button class="text-btn danger" id="x-del">삭제</button>' : '<span style="width:44px"></span>'}
    </div>
    <div class="entry-body">
      <label class="date-chip"><span id="x-day-label"></span> ▾
        <select id="x-day" aria-label="출금일">${days.map(d => `<option value="${d}" ${d === f.payDay ? 'selected' : ''}>매월 ${payDayLabel(d)}</option>`).join('')}</select></label>
      <div class="amount-display num" id="x-amt"></div>
      <input id="x-name" class="memo" placeholder="이름 (예: 통신비)" maxlength="20" value="${esc(f.name)}" autocomplete="off">
      <div class="seg"><button data-method="account">계좌 자동이체</button><button data-method="card">카드 결제</button></div>
      <div class="method-hint" id="x-mhint"></div>
      <div class="cat-grid" style="grid-template-columns:repeat(${Math.max(5, Math.ceil(state.cats.length / 2))},70px)">
        ${state.cats.map(c => `<button class="cat-opt" data-cat="${c.id}"><div class="cat-ico" style="${icoStyle(c)}">${esc(c.emoji)}</div>${esc(c.name)}</button>`).join('')}
      </div>
      <div class="keypad">
        ${keys.map(k => `<button class="key num" data-key="${k}" aria-label="${k === 'back' ? '지우기 (길게 누르면 전체 삭제)' : k}">${k === 'back' ? ICON.del : k}</button>`).join('')}
      </div>
      <button class="primary" id="x-save">저장</button>
    </div>`, { full: true });
  const el = s.el, amtEl = $('#x-amt', el), saveBtn = $('#x-save', el);

  const paint = () => {
    const n = Number(f.amount || 0);
    amtEl.innerHTML = `${formatWon(n)}<span class="won">원</span>`;
    amtEl.classList.toggle('zero', !n);
    $('#x-day-label', el).textContent = `매월 ${payDayLabel(f.payDay)}`;
    el.querySelectorAll('[data-method]').forEach(b => b.classList.toggle('on', b.dataset.method === f.method));
    $('#x-mhint', el).textContent = f.method === 'account' ? '계좌에서 빠져나가요 · 캘린더에 표시돼요' : '카드로 결제돼요 · 캘린더에 표시돼요';
    el.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === f.cat));
    const ok = n > 0 && f.name.trim() && f.cat;
    saveBtn.disabled = !ok;
    saveBtn.textContent = !n ? '금액을 입력하세요' : !f.name.trim() ? '이름을 입력하세요' : !f.cat ? '카테고리를 선택하세요' : '저장';
  };
  bindKeypad(el, key => {
    const next = keypadInput(f.amount, key);
    if (next === f.amount) return;
    f.amount = next;
    amtEl.classList.remove('bump'); void amtEl.offsetWidth; amtEl.classList.add('bump');
    paint();
  });
  $('#x-day', el).onchange = e => { f.payDay = Number(e.target.value); paint(); };
  $('#x-name', el).oninput = e => { f.name = e.target.value; paint(); };
  el.querySelectorAll('[data-method]').forEach(b => b.onclick = () => { f.method = b.dataset.method; paint(); });
  el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { f.cat = b.dataset.cat; paint(); });
  if (f.cat) requestAnimationFrame(() => { const on = el.querySelector(`[data-cat="${f.cat}"]`); on && on.scrollIntoView({ inline: 'center', block: 'nearest' }); });

  let saving = false;
  saveBtn.onclick = async () => {
    if (saveBtn.disabled || saving) return;
    saving = true;
    try {
      const now = Date.now();
      const fields = { name: f.name.trim(), amount: Number(f.amount), payDay: f.payDay, method: f.method, categoryId: f.cat, updatedAt: now };
      // v3.0.0: 지출을 자동 기록하지 않으므로 recordFrom을 더 이상 쓰지 않는다.
      // 기존 데이터의 필드는 그대로 두고, 새 항목에는 오늘 날짜를 넣어 둔다 (되돌릴 때를 대비).
      const rec = editing ? { ...fx, ...fields } : { id: uid(), ...fields, active: true, recordFrom: addDays(today, 1), createdAt: now };
      await dbPut('fixedExpenses', rec);
      const i = state.fixeds.findIndex(x => x.id === rec.id);
      if (i >= 0) state.fixeds[i] = rec; else state.fixeds.push(rec);
      s.close(); render();
      toast(editing ? '수정했어요' : '등록했어요');
    } finally { saving = false; }
  };
  if (editing) {
    $('#x-del', el).onclick = async () => {
      if (!confirm(`'${fx.name}'을(를) 삭제할까요?\n이미 기록된 지출 내역은 그대로 남아요.`)) return;
      const keysDone = state.completions.filter(c => c.fixedId === fx.id).map(c => c.key);
      try { await dbDeleteFixed(fx.id, keysDone); } catch (e) { toast('삭제하지 못했어요. 다시 시도해 주세요'); return; }
      state.fixeds = state.fixeds.filter(x => x.id !== fx.id);
      state.completions = state.completions.filter(c => c.fixedId !== fx.id);
      s.close(); render(); toast('삭제했어요');
    };
  }
  paint();
}

/* =====================================================================

const PLACEHOLDERS = {
  salary: ['💰', '급여', '5단계에서 만들어요'],
};
function renderPlaceholder(tab) {
  const [e, t, d] = PLACEHOLDERS[tab];
  $('#view').innerHTML = `<div class="topbar"><h1>${t}</h1></div>
    <div class="placeholder"><div class="big">${e}</div><b>준비 중이에요</b>${d}</div>`;
}

/* =====================================================================
   화면: 특별지출 (v4.0.0)
   반기 한도 · 여행/이벤트 · 안 쓴 돈
   페이스와 하루 사용 가능 금액은 쓰지 않는다. 특별지출은 하루씩 쓰는 돈이 아니다.
   ===================================================================== */
function halfNavHTML(h, canPrev, canNext) {
  return `<span class="cyc-nav">
    <button class="cyc-btn" data-half="-1" ${canPrev ? '' : 'disabled'} aria-label="이전 반기">${ICON.back}</button>
    <span class="cyc-name">${h.label}</span>
    <button class="cyc-btn" data-half="1" ${canNext ? '' : 'disabled'} aria-label="다음 반기">${ICON.fwd}</button>
  </span>`;
}

/** 주기별 막대 분포 */
function monthBarsHTML(months, todayCycleId) {
  const max = Math.max(1, ...months.map(m => m.amount));
  return `<div class="mbars">${months.map(m => {
    const h = Math.max(3, Math.round(m.amount / max * 64));
    const cls = ['mb', m.amount <= 0 && 'zero', m.cycle.id === todayCycleId && 'now'].filter(Boolean).join(' ');
    return `<div class="${cls}"><small class="num">${m.amount > 0 ? formatMan(m.amount) : ''}</small><i style="height:${h}px"></i><span class="num">${m.cycle.name}</span></div>`;
  }).join('')}</div>`;
}

function renderSpecial() {
  const today = todayYMD();
  const ref = state.halfRef || today;
  const isCurrent = !state.halfRef;
  const h = halfOf(ref);
  const limit = halfLimitOf(h.id);
  // 끝난 주기의 생활비 초과분만큼 특별지출에서 덜 써야 목표 저축률이 지켜진다 (v4.0.2)
  const ov = livingOverrun(state.txs, state.budgets, h, today);
  const s = halfStats(state.txs, state.events, state.cats, ref, limit, ov.over);
  const first = earliestHalf(state.txs, today);
  const evs = eventList(state.txs, state.events);
  const trend = savingTrend(state.txs, state.incomes, today, state.baseSalary, state.installYMD);
  const inc = incomeOf(cycleOf(today).id);

  // ---- 반기 한도 카드
  const eff = s.effLimit;
  const barPct = limit ? (eff > 0 ? Math.min(100, Math.round(s.spent / eff * 100)) : 100) : 0;
  const planPct = limit ? (eff > 0 ? Math.min(100, Math.round(s.projected / eff * 100)) : 100) : 0;
  const overLines = ov.items.filter(x => x.diff > 0);
  const gauge = limit
    ? `<section class="section st-${s.level}">
        <div class="gauge-head">${halfNavHTML(h, h.start > first.start, !isCurrent)}<span class="num">${s.pct}%</span></div>
        <div class="gauge-amt num">${formatWon(s.spent)}<small>원</small></div>
        <div class="gauge-of num">${ov.over ? '' : `한도 ${formatWon(limit)}원 · `}${shortDate(h.start)} – ${shortDate(h.end)}</div>
        ${ov.over ? `<div class="plan" style="margin-top:10px">
          <div class="plan-row sub"><span class="k">정한 한도</span><span class="v num">${formatWon(limit)}원</span></div>
          ${overLines.map(x => `<div class="plan-row sub"><span class="k">생활비 초과 · ${x.cycle.name} 주기</span><span class="v num" style="color:var(--danger)">−${formatWon(x.diff)}원</span></div>`).join('')}
          <div class="plan-div"></div>
          <div class="plan-row"><span class="k">실제로 쓸 수 있는 돈</span><span class="v num">${formatWon(eff)}원</span></div>
        </div>` : ''}
        <div class="hl-bar">${s.planned.total ? `<u style="left:${barPct}%;width:${Math.max(0, planPct - barPct)}%"></u>` : ''}<i style="width:${barPct}%"></i></div>
        <div class="hl-left">남은 <b class="num">${formatWon(Math.max(0, s.left))}원</b>${s.left < 0 ? ` <span class="num" style="color:var(--danger)">(${formatWon(s.left)}원 초과)</span>` : ''}</div>
        ${s.planned.total ? `<div class="plan">
          <div class="plan-row head"><span class="k">예정 포함</span><span class="v num">${formatWon(s.projected)}원</span></div>
          <div class="plan-row"><span class="k">남는 돈</span><span class="v num" style="color:${s.projectedLeft < 0 ? 'var(--danger)' : 'var(--text)'}">${formatWon(s.projectedLeft)}원</span></div>
          <div class="plan-div"></div>
          ${s.planned.items.map(x => `<div class="plan-row sub"><span class="k">${esc(x.event.name)} ${shortDate(x.event.start)}–${shortDate(x.event.end)}</span><span class="v num">예상 ${formatWon(x.rest)}원</span></div>`).join('')}
        </div>` : ''}
        <div class="delta-line">${s.count ? `${s.count}건 · 건당 평균 <span class="num">${formatWon(s.avgEach)}원</span>${s.leftCount !== null ? `<br>남은 돈으로 평균 규모 <b class="num">${s.leftCount}건</b> 정도` : ''}` : '이번 반기에 특별지출이 없어요'}</div>
        ${s.change !== null ? `<div class="delta-line">지난 반기 ${isCurrent ? '같은 시점' : '전체'}보다 ${s.spent - s.prevSame > 0 ? '▲' : '▼'}${Math.abs(s.change)}% <span class="num">(${s.spent - s.prevSame > 0 ? '+' : '−'}${formatWon(Math.abs(s.spent - s.prevSame))}원)</span></div>` : ''}
      </section>`
    : `<section class="section">
        <div class="gauge-head">${halfNavHTML(h, h.start > first.start, !isCurrent)}</div>
        <div class="gauge-amt num">${formatWon(s.spent)}<small>원</small></div>
        <div class="gauge-of num">${s.count}건 · ${shortDate(h.start)} – ${shortDate(h.end)}</div>
        <div class="delta-line">한도를 정하면 남은 금액과 예정까지 같이 보여드려요.
          <br><button class="link-btn" data-open-plan>예산 짜기</button></div>
      </section>`;

  // ---- 큰 건
  const bigSec = s.top.length ? `<section class="section">
      <h2 class="section-title">큰 건${s.topShare > 0 ? ` · 상위 ${s.top.length}건이 지출의 ${Math.round(s.topShare * 100)}%` : ''}</h2>
      ${s.top.map(t => {
        const c = catById(t.categoryId);
        const ev = t.eventId ? eventById(t.eventId) : null;
        return `<div class="big-row">
          <div class="cat-ico" style="${icoStyle(c)}">${esc(c.emoji)}</div>
          <div class="grow"><div class="t">${esc(t.merchant || c.name)}</div>
            <div class="s num">${shortDate(t.date)} · ${esc(ev ? ev.name : c.name)}</div></div>
          <div class="a num">${formatWon(t.amount)}원</div></div>`;
      }).join('')}
    </section>` : '';

  // ---- 주기별 분포
  const monthSec = `<section class="section">
      <h2 class="section-title">주기별 분포</h2>
      ${monthBarsHTML(s.months, cycleOf(today).id)}
    </section>`;

  // ---- 이벤트
  const evSec = `<section class="section">
      <div class="sec-head"><h2 class="section-title">여행 · 이벤트</h2><button class="link-btn" data-ev-add>추가</button></div>
      ${evs.length ? evs.map(x => {
        const e = x.event;
        const rest = Math.max(0, (e.estimate || 0) - x.total);
        return `<div class="tx" data-ev="${e.id}">
          <div class="cat-ico" style="background:var(--accent-weak)">🧳</div>
          <div class="tx-main"><div class="tx-title">${esc(e.name)}</div>
            <div class="tx-sub num">${shortDate(e.start)} – ${shortDate(e.end)} · ${x.count}건</div></div>
          <div class="ev-right"><div class="tx-amt num">${formatWon(x.total)}원</div>
            ${rest > 0 ? `<div class="ev-st plan num">예상 ${formatMan(e.estimate)}</div>` : e.estimate ? `<div class="ev-st num">예상 ${formatMan(e.estimate)}</div>` : ''}</div>
        </div>`;
      }).join('') : `<div class="empty">여행이나 이벤트를 만들면 그 기간 지출이 자동으로 묶여요<br>묶인 지출은 항상 특별지출로 잡혀요</div>`}
    </section>`;

  // ---- 안 쓴 돈
  const savedSec = (() => {
    if (!inc.total) {
      return `<section class="section">
        <h2 class="section-title">안 쓴 돈</h2>
        <div class="empty">급여를 넣으면 저축률과 연간 예상을 보여드려요</div>
        <button class="primary" data-open-plan>예산 짜기</button>
      </section>`;
    }
    // 이번 주기 예산이 아직 없으면 예산 짜기에서 정한 계획을 쓴다 (v4.0.2)
    const living = budgetOfCycle(cycleOf(today).id) ?? planLivingFor(state.livingPlan, today);
    const plan = living !== null ? budgetPlan(inc.total, state.savingsGoal, living, limit || 0) : null;
    return `<section class="section">
      <h2 class="section-title">안 쓴 돈</h2>
      ${plan ? `<div class="plan">
        <div class="plan-row"><span class="k">수입${inc.estimated ? '<span class="est">추정</span>' : ''}</span><span class="v num">${formatWon(inc.total)}원</span></div>
        <div class="plan-row sub"><span class="k">− 생활비 예산</span><span class="v num">${formatWon(plan.living)}원</span></div>
        <div class="plan-row sub"><span class="k">− 특별지출 ${formatMan(plan.halfLimit)} ÷ 6</span><span class="v num">${formatWon(plan.specialMonthly)}원</span></div>
        <div class="plan-div"></div>
        <div class="plan-row head"><span class="k">매달 안 쓰는 돈</span><span class="v num">${formatWon(plan.saved)}원</span></div>
        <div class="plan-row ${plan.ok ? 'good' : 'bad'}"><span class="k">저축률 (목표 ${pctText(state.savingsGoal)})</span><span class="v num">${pctText(plan.rate)}</span></div>
        <div class="plan-row sub"><span class="k">연</span><span class="v num">${formatWon(roundTo(plan.yearly, 1000))}원</span></div>
      </div>` : `<div class="hint" style="margin-top:0">생활비 예산을 정하면 계획 저축률을 계산해 드려요</div>`}
      ${trend ? `<div class="plan">
        <div class="plan-row head"><span class="k">지금 속도</span><span class="v num">${pctText(trend.rate)}</span></div>
        <div class="plan-row sub"><span class="k">최근 ${trend.count}개 주기 평균 안 쓴 돈</span><span class="v num">${formatWon(trend.avgSaved)}원</span></div>
        <div class="plan-row sub"><span class="k">이 속도면 연</span><span class="v num">${formatWon(roundTo(trend.yearly, 1000))}원</span></div>
        ${plan ? `<div class="plan-div"></div>
        <div class="plan-row ${trend.rate >= plan.rate ? 'good' : 'bad'}"><span class="k">계획 대비</span><span class="v num">${trend.rate >= plan.rate ? '+' : '−'}${(Math.abs(trend.rate - plan.rate) * 100).toFixed(1)}%p</span></div>` : ''}
      </div>` : '<div class="hint">끝난 주기가 쌓이면 실제 속도와 비교해 드려요</div>'}
      ${ov.items.length ? `<h2 class="section-title" style="margin:16px 0 4px">주기별 생활비 결과 · ${esc(h.label)}</h2>
      <div class="plan">
        ${ov.items.map(x => `<div class="plan-row sub ${x.diff > 0 ? 'bad' : 'good'}"><span class="k">${x.cycle.name} 주기<br><small class="num">예산 ${formatMan(x.budget)} · 실적 ${formatMan(x.living)}</small></span><span class="v num">${x.diff > 0 ? `+${formatMan(x.diff)} 초과` : x.diff < 0 ? `${formatMan(-x.diff)} 절약` : '딱 맞음'}</span></div>`).join('')}
        ${ov.over ? `<div class="plan-div"></div><div class="plan-row sub"><span class="k">넘친 만큼 특별지출에서 빼요</span><span class="v num" style="color:var(--danger)">−${formatWon(ov.over)}원</span></div>` : ''}
      </div>` : ''}
      <div class="hint">계좌 잔고는 앱이 알 수 없어요. 여기 숫자는 <b>수입에서 쓴 돈을 뺀 금액</b>이에요.</div>
      <button class="secondary" data-open-plan>예산 짜기</button>
    </section>`;
  })();

  $('#view').innerHTML = `
    <div class="topbar"><h1>특별지출</h1><button class="text-btn" data-open-plan>예산 짜기</button></div>
    ${gauge}${bigSec}${monthSec}${evSec}${savedSec}
    ${isCurrent ? '' : '<div class="hint" style="text-align:center;margin:0 24px">지난 반기를 보고 있어요</div>'}`;

  const el = $('#view');
  el.querySelectorAll('[data-half]').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    state.halfRef = shiftHalfRef(ref, Number(b.dataset.half), today);
    renderSpecial(); el.scrollTop = 0;
  });
  el.querySelectorAll('[data-open-plan]').forEach(b => b.onclick = () => openBudgetPlanner());
  el.querySelectorAll('[data-ev-add]').forEach(b => b.onclick = () => openEventEditor());
  el.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => openEventDetail(eventById(b.dataset.ev)));
}

/* ---- 이벤트 상세 ---- */
function openEventDetail(ev) {
  if (!ev) return;
  const st = eventStats(state.txs, ev, state.cats);
  const list = state.txs.filter(t => isCounted(t) && t.eventId === ev.id)
    .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const s = openSheet(`
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">${esc(ev.name)}</div>
      <button class="text-btn" id="ev-edit">수정</button>
    </div>
    <div class="money-big num">${formatWon(st.total)}<small>원</small></div>
    <div class="gauge-of num" style="text-align:center">${shortDate(ev.start)} – ${shortDate(ev.end)} · ${st.days}일 · ${st.count}건</div>
    <div class="plan">
      <div class="plan-row"><span class="k">하루 평균</span><span class="v num">${formatWon(st.avgDaily)}원</span></div>
      ${st.refund ? `<div class="plan-row"><span class="k">받은 돈 (정산)</span><span class="v num" style="color:var(--accent)">${formatWon(st.refund)}원</span></div>
      <div class="plan-row sub"><span class="k">쓴 돈</span><span class="v num">${formatWon(st.spend)}원</span></div>` : ''}
      ${ev.estimate ? `<div class="plan-div"></div>
      <div class="plan-row"><span class="k">예상</span><span class="v num">${formatWon(ev.estimate)}원</span></div>
      <div class="plan-row sub"><span class="k">${st.rest > 0 ? '아직 안 들어온 예상액' : '예상 대비'}</span><span class="v num">${st.rest > 0 ? formatWon(st.rest) + '원' : formatWon(st.total - ev.estimate) + '원'}</span></div>` : ''}
    </div>
    ${st.catRows.length ? `<h2 class="section-title" style="margin:16px 0 4px">카테고리 비중</h2>
      ${st.catRows.map(x => `<div class="cat-row">
        <div class="cat-ico" style="${icoStyle(x.cat)}">${esc(x.cat.emoji)}</div>
        <div class="cat-main">
          <div class="cat-line"><span class="cat-name">${esc(x.cat.name)}</span><span class="cat-amt num">${formatWon(x.spent)}원</span></div>
          <div class="cat-bar"><i style="width:${Math.max(2, Math.round(x.share * 100))}%;background:${x.cat.color}"></i></div>
          <div class="cat-meta"><span class="cat-pct num" style="color:${x.cat.color}">${Math.round(x.share * 100)}%</span></div>
        </div></div>`).join('')}
      ${st.negRows.map(x => `<div class="cat-row">
        <div class="cat-ico" style="${icoStyle(x.cat)}">${esc(x.cat.emoji)}</div>
        <div class="cat-main"><div class="cat-line"><span class="cat-name">${esc(x.cat.name)}</span><span class="cat-amt num" style="color:var(--accent)">${formatWon(x.spent)}원</span></div>
          <div class="cat-meta"><span>받은 돈이 더 많아요</span></div></div></div>`).join('')}` : ''}
    ${list.length ? `<h2 class="section-title" style="margin:16px 0 4px">묶인 내역 ${list.length}건</h2>
      ${list.slice(0, 30).map(t => txRowHTML(t, false, false)).join('')}
      ${list.length > 30 ? `<div class="pend-count">최근 30건만 보여요</div>` : ''}`
    : '<div class="empty">아직 묶인 내역이 없어요<br>그 기간 지출이 들어오면 자동으로 묶여요</div>'}`, { full: true });
  $('#ev-edit', s.el).onclick = () => { s.close(); setTimeout(() => openEventEditor(ev), 120); };
  s.el.querySelectorAll('[data-tx]').forEach(r => r.onclick = () => {
    const t = state.txs.find(x => x.id === r.dataset.tx);
    s.close(); setTimeout(() => openEntry(t), 120);
  });
}

/* ---- 이벤트 추가 / 수정 ---- */
function openEventEditor(ev) {
  const editing = !!ev;
  const today = todayYMD();
  const f = {
    name: editing ? ev.name : '',
    start: editing ? ev.start : today,
    end: editing ? ev.end : today,
    estimate: editing ? String(ev.estimate || '') : '',
  };
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'back'];
  const s = openSheet(`
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">${editing ? '이벤트 수정' : '여행 · 이벤트 추가'}</div>
      ${editing ? '<button class="text-btn danger" id="v-del">삭제</button>' : '<span style="width:44px"></span>'}
    </div>
    <div class="entry-body">
      <div class="field"><label>이름</label><input id="v-name" value="${esc(f.name)}" placeholder="예: 제주 여행" maxlength="20" autocomplete="off"></div>
      <div class="field"><label>시작일</label><input type="date" id="v-start" value="${f.start}"></div>
      <div class="field"><label>종료일</label><input type="date" id="v-end" value="${f.end}"></div>
      <div class="field"><label>예상 금액 (선택)</label></div>
      <div class="amount-display num" id="v-amt"></div>
      <div class="hint" style="text-align:center;margin:0 0 6px">넣어 두면 반기 한도에서 미리 빠져요. 실제 지출이 들어오면 그만큼 물러나요.</div>
      <div class="keypad">${keys.map(k => `<button class="key num" data-key="${k}">${k === 'back' ? ICON.del : k}</button>`).join('')}</div>
      <button class="primary" id="v-save">저장</button>
      <div class="hint">기간 안의 지출은 자동으로 이 이벤트에 묶이고 <b>항상 특별지출</b>로 잡혀요. 기간이 겹치면 나중에 만든 이벤트가 이겨요.</div>
    </div>`, { full: true });
  const el = s.el, amtEl = $('#v-amt', el), saveBtn = $('#v-save', el);

  const paint = () => {
    const n = Number(f.estimate || 0);
    amtEl.innerHTML = `${formatWon(n)}<span class="won">원</span>`;
    amtEl.classList.toggle('zero', !n);
    const bad = f.end < f.start;
    saveBtn.disabled = !f.name.trim() || bad;
    saveBtn.textContent = !f.name.trim() ? '이름을 입력하세요' : bad ? '종료일이 시작일보다 앞이에요' : '저장';
  };
  bindKeypad(el, k => { const nx = keypadInput(f.estimate, k); if (nx !== f.estimate) { f.estimate = nx; paint(); } });
  $('#v-name', el).oninput = e => { f.name = e.target.value; paint(); };
  $('#v-start', el).onchange = e => { if (e.target.value) { f.start = e.target.value; if (f.end < f.start) { f.end = f.start; $('#v-end', el).value = f.end; } paint(); } };
  $('#v-end', el).onchange = e => { if (e.target.value) { f.end = e.target.value; paint(); } };

  let saving = false;
  saveBtn.onclick = async () => {
    if (saveBtn.disabled || saving) return;
    saving = true;
    try {
      const now = Date.now();
      const rec = editing
        ? { ...ev, name: f.name.trim(), start: f.start, end: f.end, estimate: Number(f.estimate || 0), updatedAt: now }
        : { id: uid(), name: f.name.trim(), start: f.start, end: f.end, estimate: Number(f.estimate || 0), createdAt: now, updatedAt: now };
      const next = editing ? state.events.map(e => (e.id === rec.id ? rec : e)) : [...state.events, rec];
      const changed = retagEvents(state.txs, next, catMap(), state.threshold, now);
      await dbSaveEvent(rec, changed);
      state.events = next;
      applyTxChanges(changed);
      s.close(); render();
      toast(changed.length ? `${editing ? '수정했어요' : '만들었어요'} · 내역 ${changed.length}건을 묶었어요` : (editing ? '수정했어요' : '만들었어요'));
    } catch (e) { toast('저장하지 못했어요'); }
    finally { saving = false; }
  };
  if (editing) {
    $('#v-del', el).onclick = async () => {
      if (!confirm(`'${ev.name}'을(를) 삭제할까요?\n묶여 있던 내역은 남고, 이벤트 태그만 풀려요.`)) return;
      const now = Date.now();
      const next = state.events.filter(e => e.id !== ev.id);
      const changed = retagEvents(state.txs, next, catMap(), state.threshold, now);
      try { await dbSaveEvent(null, changed, ev.id); } catch (e2) { toast('삭제하지 못했어요'); return; }
      state.events = next;
      applyTxChanges(changed);
      s.close(); render(); toast(`삭제했어요 · 내역 ${changed.length}건의 태그를 풀었어요`);
    };
  }
  paint();
}
/** 바뀐 내역을 state에 반영 */
function applyTxChanges(changed) {
  if (!changed.length) return;
  const byId = Object.fromEntries(changed.map(t => [t.id, t]));
  state.txs = state.txs.map(t => byId[t.id] || t);
}

/* =====================================================================
   예산 짜기 (v4.0.0)
   목표 저축률이 '쓸 수 있는 돈'을 정하고, 그 안에서 생활비와 특별지출을 나눈다.
   생활비를 조절하면 특별지출 반기 한도가 따라 움직인다.
   ===================================================================== */
const LIVING_STEP = 50000;
function openBudgetPlanner() {
  const today = todayYMD();
  const c = cycleOf(today), h = halfOf(today);
  const inc0 = incomeOf(c.id);
  const bs = budgetState(today);
  const f = {
    salary: inc0.salary || 0,
    extras: (inc0.extras || []).map(x => ({ ...x })),
    goal: state.savingsGoal,
    living: bs.amount || 0,
    limit: halfLimitOf(h.id) || 0,
    touchedLimit: false,
  };
  const income = () => f.salary + f.extras.reduce((s, x) => s + (x.amount || 0), 0);
  // 생활비가 정해져 있지 않으면 목표 역산으로 채운다
  if (!f.living && income()) f.living = Math.max(0, roundTo(Math.round(income() * (1 - f.goal)) * 0.85, LIVING_STEP));
  if (!f.limit) f.limit = suggestHalfLimit(income(), f.goal, f.living);

  const prevHalfSpecial = (() => {
    const ph = halfOf(addDays(h.start, -1));
    return sumAmount(state.txs.filter(t => isSpecial(t) && inRange(t.date, ph.start, ph.end)));
  })();

  const s = openSheet(`
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">예산 짜기 · ${c.name} 주기<small class="num" style="display:block;font-size:12px;font-weight:400;color:var(--sub)">${shortDate(c.start)} – ${shortDate(c.end)}</small></div><span style="width:44px"></span>
    </div>
    <div id="bp-body"></div>`, { full: true });
  const el = s.el;

  const paint = () => {
    const inc = income();
    const p = budgetPlan(inc, f.goal, f.living, f.limit);
    const ch = budgetChoices(inc, f.goal, f.limit, bs.suggestion);
    $('#bp-body', el).innerHTML = `
      <div class="entry-body">
        <h2 class="section-title" style="margin:8px 0 4px">수입</h2>
        <div class="plan">
          <div class="plan-row"><span class="k">급여 (세후)${inc0.estimated && f.salary === inc0.salary ? '<span class="est">기본값</span>' : ''}</span>
            <span class="v num"><button class="link-btn" id="bp-salary" style="padding:0">${formatWon(f.salary)}원</button></span></div>
          ${f.extras.map((x, i) => `<div class="extra-row"><span class="grow">${esc(x.name || '추가 수입')}</span>
            <span class="num">${formatWon(x.amount)}원</span>
            <button class="mini-btn" data-ex-del="${i}" aria-label="삭제">${ICON.close}</button></div>`).join('')}
          <div class="plan-div"></div>
          <div class="plan-row head"><span class="k">이번 주기 수입</span><span class="v num">${formatWon(inc)}원</span></div>
        </div>
        <button class="link-btn" id="bp-extra">+ 추가 수입 넣기</button>

        <h2 class="section-title" style="margin:16px 0 4px">목표 저축률</h2>
        <div class="seg" style="margin-top:0">
          ${SAVE_GOALS.map(g => `<button data-goal="${g}" class="${Math.abs(f.goal - g) < 0.001 ? 'on' : ''}">${Math.round(g * 100)}%</button>`).join('')}
          <button data-goal="custom" class="${SAVE_GOALS.some(g => Math.abs(f.goal - g) < 0.001) ? '' : 'on'}">직접</button>
        </div>

        <div class="plan">
          <div class="plan-row head"><span class="k">쓸 수 있는 돈</span><span class="v num">${formatWon(p.spendable)}원</span></div>
          <div class="plan-row"><span class="k">생활비 예산 (월)</span>
            <span class="stepper"><button data-liv="-1">−</button><span class="v num">${formatWon(f.living)}</span><button data-liv="1">+</button></span></div>
          <div class="plan-row"><span class="k">특별지출 (월)</span><span class="v num">${formatWon(p.specialMonthly)}원</span></div>
          <div class="plan-row sub"><span class="k">→ 반기 한도</span><span class="v num">${formatWon(f.limit)}원</span></div>
          <div class="plan-div"></div>
          <div class="plan-row head ${p.ok ? '' : 'bad'}"><span class="k">남는 돈</span><span class="v num">${formatWon(p.rest)}원</span></div>
        </div>
        ${p.ok ? '' : `<div class="hint" style="color:var(--danger)">목표 저축률보다 ${formatWon(-p.rest)}원 더 쓰는 예산이에요. 저장은 되지만 실제 저축률은 ${pctText(p.rate)}가 돼요.</div>`}

        <h2 class="section-title" style="margin:16px 0 4px">실적과 비교</h2>
        <div class="plan">
          ${bs.suggestion ? `<div class="plan-row sub"><span class="k">최근 ${bs.suggestion.count}개 주기 생활비 중앙값</span><span class="v num">${formatWon(bs.suggestion.median)}원</span></div>` : '<div class="plan-row sub"><span class="k">생활비 실적</span><span class="v">아직 끝난 주기가 없어요</span></div>'}
          ${prevHalfSpecial ? `<div class="plan-row sub"><span class="k">지난 반기 특별지출</span><span class="v num">${formatWon(prevHalfSpecial)}원 (월 ${formatWon(Math.round(prevHalfSpecial / 6))})</span></div>` : '<div class="plan-row sub"><span class="k">지난 반기 특별지출</span><span class="v">기록이 없어요</span></div>'}
          ${bs.suggestion ? `<div class="plan-div"></div><div class="plan-row sub ${f.living >= bs.suggestion.median ? 'good' : 'bad'}"><span class="k">생활비 예산 − 실적</span><span class="v num">${f.living - bs.suggestion.median >= 0 ? '+' : '−'}${formatWon(Math.abs(f.living - bs.suggestion.median))}원</span></div>` : ''}
        </div>
        <div class="dual">
          <button data-pick-liv="${ch.fromGoal}" class="${f.living === ch.fromGoal ? 'on' : ''}">목표 역산<b class="num">${formatMan(ch.fromGoal)}</b></button>
          ${ch.fromHistory !== null ? `<button data-pick-liv="${ch.fromHistory}" class="${f.living === ch.fromHistory ? 'on' : ''}">실적 기준<b class="num">${formatMan(ch.fromHistory)}</b></button>` : '<button disabled>실적 기준<b>-</b></button>'}
        </div>

        <h2 class="section-title" style="margin:16px 0 4px">이 예산대로 가면</h2>
        <div class="plan">
          <div class="plan-row head"><span class="k">매달 안 쓰는 돈</span><span class="v num">${formatWon(p.saved)}원</span></div>
          <div class="plan-row ${p.ok ? 'good' : 'bad'}"><span class="k">저축률</span><span class="v num">${pctText(p.rate)}</span></div>
          <div class="plan-row sub"><span class="k">연</span><span class="v num">${formatWon(roundTo(p.yearly, 1000))}원</span></div>
        </div>
        <button class="primary" id="bp-save" style="margin-top:14px" ${inc > 0 && f.living > 0 ? '' : 'disabled'}>${inc > 0 ? (f.living > 0 ? '예산 저장' : '생활비 예산을 정하세요') : '급여를 넣어 주세요'}</button>
        <div class="hint">저장하면 ${c.name} 주기(${shortDate(c.start)}–${shortDate(c.end)}) 생활비 예산과 ${h.label} 특별지출 한도가 같이 정해져요. 급여는 이 주기에만 저장돼요.</div>
      </div>`;

    // 목표율·생활비 조절
    el.querySelectorAll('[data-goal]').forEach(b => b.onclick = async () => {
      if (b.dataset.goal === 'custom') {
        openPercentSheet(f.goal, v => { f.goal = v; f.limit = suggestHalfLimit(income(), f.goal, f.living); paint(); });
        return;
      }
      f.goal = Number(b.dataset.goal);
      f.limit = suggestHalfLimit(income(), f.goal, f.living);
      paint();
    });
    el.querySelectorAll('[data-liv]').forEach(b => b.onclick = () => {
      const next = f.living + Number(b.dataset.liv) * LIVING_STEP;
      if (next < 0) return;
      f.living = next;
      f.limit = suggestHalfLimit(income(), f.goal, f.living);
      paint();
    });
    el.querySelectorAll('[data-pick-liv]').forEach(b => b.onclick = () => {
      f.living = Number(b.dataset.pickLiv);
      f.limit = suggestHalfLimit(income(), f.goal, f.living);
      paint();
    });
    // 급여·추가 수입
    $('#bp-salary', el).onclick = () => openAmountSheet({
      title: `${shortDate(c.start)} 받는 급여 (세후)`,
      initial: f.salary,
      hint: state.baseSalary ? `기본 급여 ${formatWon(state.baseSalary)}원 · 이 주기만 바뀌어요` : '처음 넣는 급여는 다음 주기 기본값이 돼요',
      onSave: n => { f.salary = n; f.limit = suggestHalfLimit(income(), f.goal, f.living); paint(); },
    });
    $('#bp-extra', el).onclick = () => openExtraSheet(x => { f.extras.push(x); f.limit = suggestHalfLimit(income(), f.goal, f.living); paint(); });
    el.querySelectorAll('[data-ex-del]').forEach(b => b.onclick = () => {
      f.extras.splice(Number(b.dataset.exDel), 1);
      f.limit = suggestHalfLimit(income(), f.goal, f.living);
      paint();
    });
    // 저장
    const save = $('#bp-save', el);
    save.onclick = async () => {
      if (save.disabled) return;
      save.disabled = true;
      const now = Date.now();
      const budget = { cycleId: c.id, amount: f.living, suggested: bs.suggestion ? bs.suggestion.amount : null, confirmedAt: now };
      const limit = { halfId: h.id, amount: f.limit, confirmedAt: now };
      const incomeRec = { cycleId: c.id, salary: f.salary, extras: f.extras, editedAt: now };
      try { await dbSavePlan(budget, limit, incomeRec); }
      catch (e) { toast('저장하지 못했어요'); save.disabled = false; return; }
      state.budgets[c.id] = budget;
      state.halfLimits[h.id] = limit;
      state.incomes[c.id] = incomeRec;
      // 이 생활비를 반기 끝까지 다음 주기 제안값으로 이어 쓴다 (v4.0.2)
      state.livingPlan = { halfId: h.id, amount: f.living, savedAt: now };
      await dbPut('meta', { key: 'livingPlan', value: state.livingPlan }).catch(() => {});
      if (Math.abs(state.savingsGoal - f.goal) > 0.001) {
        state.savingsGoal = f.goal;
        await dbPut('meta', { key: 'savingsGoal', value: f.goal }).catch(() => {});
      }
      if (!state.baseSalary && f.salary > 0) {
        state.baseSalary = f.salary;
        await dbPut('meta', { key: 'baseSalary', value: f.salary }).catch(() => {});
      }
      s.close(); render(); toast('예산을 저장했어요');
    };
  };
  paint();
}

/** 목표 저축률 직접 입력 (1% 단위) */
function openPercentSheet(cur, onSave) {
  let v = Math.round(cur * 100);
  const s = openSheet(`
    <div class="sheet-head"><button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">목표 저축률</div><span style="width:44px"></span></div>
    <div class="amount-display num" id="pc-v"></div>
    <div class="hint" style="text-align:center;margin:0 0 12px">수입에서 이 비율만큼은 쓰지 않는 것을 목표로 해요</div>
    <div class="plan-row" style="justify-content:center">
      <span class="stepper"><button data-p="-5">−</button><span class="v num" id="pc-s">${v}%</span><button data-p="5">+</button></span>
    </div>

/* =====================================================================
   시트 / 페이지
   ===================================================================== */
function openSheet(html, { full = false, onClose, dismissable = true } = {}) {
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet' + (full ? ' full' : '');
  sh.innerHTML = `<div class="grabber"></div>${html}`;
  document.body.append(bd, sh);
  requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    if (document.activeElement) document.activeElement.blur();
    bd.classList.remove('show'); sh.classList.remove('show');
    setTimeout(() => { bd.remove(); sh.remove(); }, 300);
    onClose && onClose();
  };
  if (dismissable) bd.onclick = close;
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  if (dismissable) {
    let y0 = null;
    [sh.querySelector('.grabber'), sh.querySelector('.sheet-head')].forEach(el => el && el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true }));
    sh.addEventListener('touchmove', e => {
      if (y0 === null) return;
      const dy = e.touches[0].clientY - y0;
      if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
    }, { passive: true });
    sh.addEventListener('touchend', e => {
      if (y0 === null) return;
      const dy = e.changedTouches[0].clientY - y0;
      y0 = null; sh.style.transition = ''; sh.style.transform = '';
      if (dy > 120) close();
    });
  }
  return { el: sh, close };
}
function openPage(html) {
  const pg = document.createElement('div'); pg.className = 'page';
  pg.innerHTML = html;
  document.body.append(pg);
  requestAnimationFrame(() => pg.classList.add('show'));
  const close = () => { pg.classList.remove('show'); setTimeout(() => pg.remove(), 300); render(); };
  pg.querySelectorAll('[data-back]').forEach(b => b.onclick = close);
  return { el: pg, close };
}

/** 계획대로 저장한다. 확인 필요 건은 내역 없이 대기 상태로만 저장한다. */
async function commitImport(fileName, rows, plan) {
  const now = Date.now();
  const batch = {
    id: uid(), fileName, importedAt: now,
    rowCount: rows.length, addedCount: plan.record.length,
    pendingCount: plan.pending.length, excludedCount: plan.exclude.length,
    from: plan.from, to: plan.to,
  };
  const fb = fallbackId();
  const recs = [];
  plan.record.forEach(x => {
    // 가져온 내역도 날짜가 이벤트 기간 안이면 자동으로 묶는다 (v4.0.0). 확인 대기함에는 올리지 않는다
    const tx = recomputeKind(withEvent(makeImportTx(x, state.cats, state.threshold, fb, uid(), now)), catMap(), state.threshold);
    recs.push({ tx, row: importRowRec(x, batch.id, 'done', tx.id) });
  });
  plan.pending.forEach(x => recs.push({ tx: null, row: importRowRec(x, batch.id, 'pending', null) }));
  plan.exclude.forEach(x => recs.push({ tx: null, row: importRowRec(x, batch.id, 'excluded', null) }));
  await dbPutImport(batch, recs);
  recs.forEach(r => { if (r.tx) state.txs.push(r.tx); state.importRows.push(r.row); });
  state.batches.push(batch);
  // 파일에서 본 결제수단을 기억해 둔다 (설정에서 제외할 수단을 고를 수 있게)
  const seen = new Set([...state.seenMethods, ...plan.methods]);
  state.seenMethods = [...seen].sort();
  await dbPut('meta', { key: 'seenMethods', value: state.seenMethods });
}
function importRowRec(x, batchId, status, transactionId) {
  return {
    id: x.id, batchId, status, reason: x.reason,
    date: x.r.date, time: x.r.time, amount: x.amount,
    raw: x.r, categoryName: x.categoryName || '기타', transactionId,
  };
}

/** 확인 대기함 한 건 처리 */
async function resolvePending(row, pick, catId, learn) {
  const now = Date.now();
  const next = { ...row, status: pick === 'skip' ? 'skipped' : 'done', updatedAt: now };
  let tx = null;
  if (pick !== 'skip') {
    const cats = state.cats;
    const x = { id: row.id, r: row.raw, amount: row.amount, categoryName: (cats.find(c => c.id === catId) || {}).name };
    // 확인 대기함에서 직접 고른 분류는 그대로 지킨다.
    // recomputeKind를 그냥 돌리면 기준 금액 아래인 건(특히 받은 돈 = 음수)이 생활비로 되돌아간다.
    // 이벤트에 묶인 건만 4단계 규칙대로 특별지출로 올린다.
    const chosen = pick === 'special' ? 'special' : 'living';
    tx = withEvent(makeImportTx(x, cats, state.threshold, fallbackId(), uid(), now, chosen));
    tx.kind = tx.eventId ? 'special' : chosen;
    tx.kindSource = 'asked';
    next.transactionId = tx.id;
    next.categoryName = x.categoryName;
  }
  let rule = null;
  if (learn) {
    rule = {
      key: ruleKey(row.raw.type, row.raw.content),
      kind: pick === 'skip' ? 'exclude' : 'record',
      categoryName: pick === 'skip' ? null : (state.cats.find(c => c.id === catId) || {}).name,
      categoryId: pick === 'skip' ? null : catId,
      updatedAt: now,
    };
  }
  await dbResolveRow(next, tx, rule);
  const idx = state.importRows.findIndex(r => r.id === row.id);
  if (idx >= 0) state.importRows[idx] = next;
  if (tx) state.txs.push(tx);
  if (rule) state.rules[rule.key] = rule;
}

/* =====================================================================
   입력 / 수정 화면 (자체 숫자 키패드)
   ===================================================================== */
function openEntry(tx) {
  const editing = !!tx;
  const f = {
    amount: editing ? String(Math.abs(tx.amount)) : '',
    neg: editing ? tx.amount < 0 : false,
    cat: editing ? tx.categoryId : null,
    date: editing ? tx.date : todayYMD(),
    time: editing ? tx.time : nowHM(),
    merchant: editing ? (tx.merchant || '') : '',
    kind: editing ? (tx.kind || 'living') : 'living',
    kindSource: editing ? (tx.kindSource || 'auto') : 'auto',
    eventId: editing ? (tx.eventId || null) : null,
    eventSource: editing ? (tx.eventSource || 'auto') : 'auto',
  };
  // 새 내역은 날짜로 이벤트를 찾아 자동으로 묶는다 (v4.0.0)
  if (!editing) f.eventId = eventIdFor({ date: f.date, eventSource: 'auto' }, state.events);
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'back'];
  const s = openSheet(`
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">${editing ? '내역 수정' : '지출 입력'}</div>
      ${editing ? '<button class="text-btn danger" id="e-del">삭제</button>' : '<span style="width:44px"></span>'}
    </div>
    <div class="entry-body">
      <label class="date-chip"><span id="e-date-label"></span> ▾<input type="date" id="e-date" value="${f.date}"></label>
      <div class="amount-display num" id="e-amt"></div>
      <input id="e-merchant" class="memo" placeholder="어디서 썼나요? (선택)" maxlength="40" value="${esc(f.merchant)}" autocomplete="off">
      <div id="e-ev"></div>
      ${editing ? `<div class="seg" id="e-kind"><button data-kind="living">생활비</button><button data-kind="special">특별지출</button></div>` : ''}
      <div class="cat-grid" id="e-cats" style="grid-template-columns:repeat(${Math.max(5, Math.ceil(state.cats.length / 2))},70px)">
        ${state.cats.map(c => `<button class="cat-opt" data-cat="${c.id}"><div class="cat-ico" style="${icoStyle(c)}">${esc(c.emoji)}</div>${esc(c.name)}</button>`).join('')}
      </div>
      <div class="keypad">
        ${keys.map(k => `<button class="key num" data-key="${k}" aria-label="${k === 'back' ? '지우기 (길게 누르면 전체 삭제)' : k}">${k === 'back' ? ICON.del : k}</button>`).join('')}
      </div>
      <button class="primary" id="e-save">저장</button>
    </div>`, { full: true });
  const el = s.el;
  const amtEl = $('#e-amt', el), saveBtn = $('#e-save', el);
  const signed = () => (f.neg ? -Number(f.amount || 0) : Number(f.amount || 0));

  const shownKind = () => resolveKind({ amount: signed(), categoryId: f.cat, eventId: f.eventId, kind: f.kind, kindSource: f.kindSource, method: editing ? tx.method : 'manual' }, catMap(), state.threshold).kind;
  // 이벤트 묶기 — 이 건만 빼거나 다시 넣을 수 있다 (v4.0.0)
  const paintEvent = () => {
    const box = $('#e-ev', el);
    const owner = eventForDate(state.events, f.date);
    const cur = f.eventId ? eventById(f.eventId) : null;
    const ev = cur || owner;
    if (!ev) { box.innerHTML = ''; return; }
    const on = !!f.eventId;
    box.innerHTML = `<div class="switch-row">
      <div class="grow">🧳 ${esc(ev.name)}에 넣기<small>${on ? '이 지출은 항상 특별지출로 잡혀요' : '이 건만 빼 뒀어요'}</small></div>
      <label class="switch"><input type="checkbox" id="e-ev-on" ${on ? 'checked' : ''}><span></span></label>
    </div>`;
    $('#e-ev-on', el).onchange = e2 => {
      if (e2.target.checked) { f.eventId = (owner || ev).id; f.eventSource = 'auto'; }
      else { f.eventId = null; f.eventSource = 'manual'; }
      paint();
    };
  };
  const paint = () => {
    const n = Number(f.amount || 0);
    const k = shownKind();
    el.querySelectorAll('[data-kind]').forEach(b => b.classList.toggle('on', b.dataset.kind === k));
    amtEl.innerHTML = `${formatWon(signed())}<span class="won">원</span>`;
    amtEl.classList.toggle('zero', !n);
    $('#e-date-label', el).textContent = dateLabel(f.date);
    paintEvent();
    el.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === f.cat));
    saveBtn.disabled = !(n > 0 && f.cat);
    saveBtn.textContent = !n ? '금액을 입력하세요' : !f.cat ? '카테고리를 선택하세요' : '저장';
  };
  bindKeypad(el, key => {
    const next = keypadInput(f.amount, key);
    if (next === f.amount) return;
    f.amount = next;
    amtEl.classList.remove('bump'); void amtEl.offsetWidth; amtEl.classList.add('bump');
    paint();
  });
  el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { f.cat = b.dataset.cat; paint(); });
  el.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
    if (b.dataset.kind === shownKind()) return;
    f.kind = b.dataset.kind; f.kindSource = 'manual'; paint();
  });
  const dateIn = $('#e-date', el);
  dateIn.onchange = () => {
    if (!dateIn.value) return;
    f.date = dateIn.value;
    if (f.eventSource !== 'manual') f.eventId = eventIdFor({ date: f.date, eventSource: 'auto' }, state.events);
    paint();
  };
  $('#e-merchant', el).oninput = e => { f.merchant = e.target.value; };

  if (f.cat) requestAnimationFrame(() => { const on = el.querySelector(`[data-cat="${f.cat}"]`); on && on.scrollIntoView({ inline: 'center', block: 'nearest' }); });

  let saving = false;
  saveBtn.onclick = async () => {
    if (saveBtn.disabled || saving) return;
    saving = true;
    try {
      const now = Date.now();
      const base = editing ? { ...tx } : {
        id: uid(), time: f.time, method: 'manual', status: 'active', eventId: null, createdAt: now,
      };
      const rec = {
        ...base, amount: signed(), categoryId: f.cat, date: f.date,
        merchant: f.merchant.trim(), kind: f.kind, kindSource: f.kindSource, updatedAt: now,
        eventId: f.eventId, eventSource: f.eventSource,
      };
      const r = resolveKind(rec, catMap(), state.threshold);
      rec.kind = r.kind; rec.kindSource = r.kindSource;
      if (r.ask) {
        const answer = await askChoice({
          title: '특별지출로 분류할까요?',
          desc: `${formatWon(state.threshold)}원 이상인 지출이에요. 특별지출은 생활비 게이지에서 빠지고 따로 합계만 보여요.`,
          options: [{ label: '특별지출로 분류', value: 'special' }, { label: '생활비로 두기', value: 'living' }],
        });
        if (answer === null) return;
        rec.kind = answer; rec.kindSource = 'asked';
      }
      await dbPut('transactions', rec);
      const i = state.txs.findIndex(t => t.id === rec.id);
      if (i >= 0) state.txs[i] = rec; else state.txs.push(rec);
      s.close(); render();
      toast(editing ? '수정했어요' : `${catById(rec.categoryId).emoji} ${formatWon(rec.amount)}원 저장했어요${rec.kind === 'special' ? ' (특별)' : ''}`);
    } finally { saving = false; }
  };
  if (editing) {
    $('#e-del', el).onclick = async () => {
      if (!confirm('이 내역을 삭제할까요?')) return;
      await dbDel('transactions', tx.id);
      state.txs = state.txs.filter(t => t.id !== tx.id);
      s.close(); render(); toast('삭제했어요');
    };
  }
  paint();
}

    delete state.rules[k];
    s.close(); done(); toast('규칙을 지웠어요');
  });
}

/** 가져오기 기록 + 되돌리기 */
function openBatchList(done) {
  const list = [...state.batches].sort((a, b) => b.importedAt - a.importedAt);
  const s = openSheet(`
    <div class="sheet-head"><button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">가져오기 기록</div><span style="width:44px"></span></div>
    ${list.length ? list.map(b => `
      <div class="imp-row">
        <div class="grow"><div class="t">${esc(b.fileName || '파일')}</div>
          <div class="s num">${esc(b.from || '')} ~ ${esc(b.to || '')} · 기록 ${b.addedCount}건${b.pendingCount ? ` · 확인 ${b.pendingCount}건` : ''}</div></div>
        <button class="text-btn danger" data-undo="${b.id}">되돌리기</button>
      </div>`).join('') : '<div class="empty">아직 가져온 파일이 없어요</div>'}
    <div class="hint">되돌리면 그때 들어온 내역이 전부 지워져요. 직접 입력한 내역은 그대로 있어요.</div>`);
  s.el.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    const id = b.dataset.undo;
    const rows = state.importRows.filter(r => r.batchId === id);
    const txIds = rows.map(r => r.transactionId).filter(Boolean);
    if (!confirm(`이 파일로 들어온 내역 ${txIds.length}건을 지울까요?`)) return;
    try { await dbUndoImport(id, txIds, rows.map(r => r.id)); } catch (e) { toast('되돌리지 못했어요'); return; }
    const gone = new Set(txIds);
    state.txs = state.txs.filter(t => !gone.has(t.id));
    state.importRows = state.importRows.filter(r => r.batchId !== id);
    state.batches = state.batches.filter(x => x.id !== id);
    s.close(); done(); render(); toast('되돌렸어요');
  });
}

function openCategoryEditor(cat, done) {
  const count = cat ? state.txs.filter(t => t.categoryId === cat.id).length : 0;
  const canDelete = cat && !cat.isFallback;
  const s = openSheet(`
    <div class="sheet-head"><button class="icon-btn" data-close aria-label="닫기">${ICON.close}</button>
      <div class="title">${cat ? '카테고리 수정' : '카테고리 추가'}</div><span style="width:44px"></span></div>
    <div class="field"><label>이모지</label><input id="c-emoji" value="${cat ? esc(cat.emoji) : ''}" placeholder="예: 🐶" autocomplete="off"></div>
    <div class="field"><label>이름</label><input id="c-name" value="${cat ? esc(cat.name) : ''}" placeholder="예: 반려동물" maxlength="10" autocomplete="off"></div>
    <div class="switch-row">
      <div class="grow">특별지출 카테고리<small>이 카테고리 지출은 항상 특별지출로 분류</small></div>
      <label class="switch"><input type="checkbox" id="c-special" ${cat && cat.isSpecial ? 'checked' : ''}><span></span></label>
    </div>
    <button class="primary" id="c-save" style="margin-top:16px">저장</button>
    ${canDelete ? '<button class="danger-btn" id="c-del">카테고리 삭제</button>' : ''}
    ${cat && cat.isFallback ? `<div class="hint" style="text-align:center">'${esc(cat.name)}'는 삭제한 카테고리의 내역이 옮겨가는 곳이라 삭제할 수 없어요</div>` : ''}`);
  const el = s.el;

  $('#c-save', el).onclick = async () => {
    const name = $('#c-name', el).value.trim();
    const emoji = [...$('#c-emoji', el).value.trim()].slice(0, 2).join('') || '📁';
    const isSp = $('#c-special', el).checked;
    if (!name) { toast('이름을 입력하세요'); return; }
    if (state.cats.some(c => c.name === name && (!cat || c.id !== cat.id))) { toast('같은 이름이 있어요'); return; }
    let rec;
    const flagChanged = cat ? !!cat.isSpecial !== isSp : false;
    if (cat) { rec = Object.assign(cat, { name, emoji, isSpecial: isSp }); }
    else {
      rec = { id: uid(), name, emoji, color: EXTRA_COLORS[state.cats.length % EXTRA_COLORS.length], order: state.cats.length, isSpecial: isSp, isFallback: false, createdAt: Date.now() };
      state.cats.push(rec);
    }
    await dbPut('categories', rec);
    if (flagChanged) {
      const map = catMap();
      const changed = state.txs.filter(t => t.categoryId === rec.id)
        .map(t => recomputeKind(t, map, state.threshold));
      await dbPutMany('transactions', changed);
      const byId = Object.fromEntries(changed.map(t => [t.id, t]));
      state.txs = state.txs.map(t => byId[t.id] || t);
    }
    s.close(); done(); toast('저장했어요');
  };

  if (canDelete) {
    $('#c-del', el).onclick = async () => {
      const fb = fallbackCat();
      if (!fb) { toast(`'${FALLBACK_NAME}' 카테고리를 찾을 수 없어요`); return; }
      const fCount = state.fixeds.filter(f => f.categoryId === cat.id).length;
      const rCount = Object.values(state.rules).filter(r => r.categoryId === cat.id).length;
      const parts = [count && `내역 ${count}건`, fCount && `고정지출 ${fCount}개`, rCount && `규칙 ${rCount}개`].filter(Boolean).join('과 ');
      const josa = (a, b) => (parts.endsWith('건') ? a : b);
      const msg = parts
        ? `'${cat.name}'을(를) 삭제할까요?\n이 카테고리의 ${parts}${josa('은', '는')} '${fb.name}'로 옮겨집니다.`
        : `'${cat.name}'을(를) 삭제할까요?`;
      if (!confirm(msg)) return;
      const moved = reassignCategory(state.txs, cat.id, fb.id, catMap(), state.threshold);
      const movedFixeds = reassignFixed(state.fixeds, cat.id, fb.id);
      const movedRules = reassignRules(state.rules, cat.id, fb.id).map(r => ({ ...r, categoryName: fb.name }));
      try {
        await dbDeleteCategory(cat.id, moved, movedFixeds, movedRules);
      } catch (e) {
        toast('삭제하지 못했어요. 다시 시도해 주세요'); return;
      }
      const byId = Object.fromEntries(moved.map(t => [t.id, t]));
      state.txs = state.txs.map(t => byId[t.id] || t);
      const fById = Object.fromEntries(movedFixeds.map(f => [f.id, f]));
      state.fixeds = state.fixeds.map(f => fById[f.id] || f);
      movedRules.forEach(r => { state.rules[r.key] = r; });
      state.cats = state.cats.filter(c => c.id !== cat.id);
      state.cats.forEach((c, k) => { c.order = k; });
      await dbPutMany('categories', state.cats);
      if (state.filterCat === cat.id) state.filterCat = 'all';
      s.close(); done(); toast(parts ? `삭제했어요 · ${parts}${josa('을', '를')} '${fb.name}'로 옮겼어요` : '삭제했어요');
    };
  }
}

/* =====================================================================
   시작
   ===================================================================== */
async function init() {
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  $('#fab').onclick = openAddMenu;

  try {
    db = await openDB();
  } catch (e) {
    $('#view').innerHTML = `<div class="placeholder"><div class="big">⚠️</div><b>저장소를 열 수 없어요</b>${esc(e && e.message)}</div>`;
    return;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  state.cats = (await dbAll('categories')).sort((a, b) => a.order - b.order);
  if (!state.cats.length) {
    state.cats = DEFAULT_CATEGORIES.map(([name, emoji, color], i) => ({
      id: uid(), name, emoji, color, order: i,
      isSpecial: name === '경조사·선물', isFallback: name === FALLBACK_NAME, createdAt: Date.now(),
    }));
    await dbPutMany('categories', state.cats);
    await dbPut('meta', { key: 'installedAt', value: Date.now() });
  }
  state.txs = await dbAll('transactions');
  (await dbAll('cycleBudgets')).forEach(b => { state.budgets[b.cycleId] = b; });
  const th = await dbGet('meta', 'specialThreshold');
  state.threshold = th ? th.value : DEFAULT_THRESHOLD;
  state.fixeds = await dbAll('fixedExpenses');
  state.completions = await dbAll('fixedCompletions');
  state.importRows = await dbAll('importRows');
  state.batches = await dbAll('importBatches');
  (await dbAll('merchantRules')).forEach(r => { state.rules[r.key] = r; });
  // 기본 규칙은 저장된 규칙이 없을 때만 깔아 둔다 (사용자가 지운 규칙을 되살리지 않기 위해)
  if (!state.batches.length) Object.entries(BS_DEFAULT_RULES).forEach(([k, v]) => { if (!state.rules[k]) state.rules[k] = { key: k, ...v }; });
  const fv = await dbGet('meta', 'fixedView');
  if (fv) state.fixedView = fv.value;
  const em = await dbGet('meta', 'excludeMethods');
  if (em) state.excludeMethods = em.value;
  const sm = await dbGet('meta', 'seenMethods');
  if (sm) state.seenMethods = sm.value;
  const cn = await dbGet('meta', 'chargeNames');
  if (cn) state.chargeNames = cn.value;
  const ie = await dbGet('meta', 'importEvery');
  if (ie) state.importEvery = ie.value;
  // v4.0.0
  state.events = await dbAll('events');
  (await dbAll('halfLimits')).forEach(r => { state.halfLimits[r.halfId] = r; });
  (await dbAll('cycleIncomes')).forEach(r => { state.incomes[r.cycleId] = r; });
  const bsal = await dbGet('meta', 'baseSalary');
  if (bsal) state.baseSalary = bsal.value || 0;
  const sg2 = await dbGet('meta', 'savingsGoal');
  if (sg2 && sg2.value) state.savingsGoal = sg2.value;
  const lp = await dbGet('meta', 'livingPlan');
  if (lp && lp.value) state.livingPlan = lp.value;
  // 실적(생활비 중앙값·저축률)을 셀 때 어디까지 거슬러 올라갈지 정하는 기준선.
  // 설치일만 쓰면 파일로 가져온 설치 이전 주기가 전부 빠진다 (v4.0.1에서 고침).
  // 설치일과 가장 이른 내역 날짜 중 '이른 쪽'을 쓴다.
  // 주기 시작일이 이 날짜보다 앞서면 후보에서 빠지므로, 파일 첫 주기처럼 반쪽만 있는 주기는 그대로 걸러진다.
  const inst = await dbGet('meta', 'installedAt');
  const instYMD = inst ? toYMD(new Date(inst.value)) : null;
  const earliest = state.txs.map(t => t.date).sort()[0];
  state.installYMD = coverageStart(instYMD, earliest, todayYMD());
  render();

  // 날짜가 바뀌었을 수 있으니 앱으로 돌아올 때 다시 그린다
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (document.querySelector('.sheet,.page')) return;
    state.homeRef = null; // 앱을 다시 열면 언제나 이번 주기부터
    state.halfRef = null; // 특별지출도 이번 반기부터
    render();
  });
}

// 서비스워커: 새 버전이 설치되면 자동으로 새로고침
if ('serviceWorker' in navigator) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || document.querySelector('.sheet')) return;
    reloaded = true; location.reload();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
init();
</script>
</body>
</html>
